<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plano de Gestão e IA da Banana Milk</title>
<meta name="description" content="Diagnóstico, projetos prioritários e instrumentos para a próxima etapa do negócio. AI Assessment & Opportunities.">
<link rel="icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens/tokens.css">
<link rel="stylesheet" href="src/camacho.css">
<link rel="stylesheet" href="src/site.css">
</head>
<body class="dk">

<div class="cmc-shell">
  <div class="dk__barra">
    <a class="cmc-lockup cmc-lockup--sm" href="site.html" style="color:#fff">
      <svg class="cmc-lockup__mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#fff"/>
        <path fill="#000" fill-rule="evenodd" d="M32 12a20 20 0 1 0 0 40 20 20 0 0 0 19.6-16H41.2A10.5 10.5 0 1 1 41.2 28h10.4A20 20 0 0 0 32 12Z"/>
      </svg>
      <span class="cmc-lockup__word" data-brand="name">Camacho</span>
    </a>
    <div class="dk__regua" id="regua" aria-hidden="true"></div>
    <div class="cmc-controls">
      <span class="dk__conta" id="conta">01 / 23</span>
      <button class="cmc-btn cmc-btn--ghost" type="button" id="anterior" aria-label="Passo anterior">←</button>
      <button class="cmc-btn cmc-btn--ghost" type="button" id="proximo" aria-label="Próximo passo">→</button>
      <button class="cmc-btn cmc-btn--inverse" type="button" id="tela">Tela cheia</button>
    </div>
  </div>

  <div class="dk__palco" id="palco" tabindex="0" aria-label="Apresentação. Use as setas para navegar."></div>

  <p class="cmc-small" style="padding-block:var(--cmc-sp-4)">
    Setas ou espaço avançam um passo · <kbd>↑</kbd><kbd>↓</kbd> pulam a cena inteira ·
    <kbd>F</kbd> tela cheia · <a id="link-notas" style="color:inherit;text-decoration:underline;cursor:pointer">notas do apresentador</a> ·
    imprima para PDF pelo navegador.
  </p>

  <div class="dk__notas" id="notas" hidden></div>
</div>

<script type="module">
import { init, render, anima, parar } from './src/dither.js';
import { applyBrand, brandFromUrl } from './src/brand.js';
import { CENAS, REGISTRO_EDITORIAL, ATIVOS, PENDENCIAS, campoDaCena, arteNoBeat } from './src/apresentacao.js';

const marca = applyBrand(document, brandFromUrl());
const params = new URLSearchParams(location.search);

/* O href sai por DOM, nunca escrito no markup: o guard de auto-contenção de
   src/inline.mjs derruba o build em qualquer href local sobrevivente, e um
   "?notas=1" literal conta como local. Ele pegou este aqui na primeira vez. */
document.getElementById('link-notas').href = '?notas=1';

const CAMPOS = { escuro: ['#000000', '#FFFFFF'], papel: ['#F2F0EE', '#000000'] };
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

/* --- Montagem ------------------------------------------------------------
   Cada pedaço de conteúdo recebe o número do beat em que aparece, e o contador
   `b` é incrementado só quando a cena declarou um beat para aquele pedaço.
   Assim a ordem de revelação sai da ordem do conteúdo, sem tabela paralela. */

function placa(chave) {
  const a = ATIVOS[chave];
  return `<div class="dk__placa"><b>Falta ${esc(a.o)}</b><span>${esc(a.arquivo)}</span></div>`;
}

/* Tabela, opcionalmente partida em blocos de `quebra` linhas — cada bloco vira
   um painel e repete o cabeçalho. É o que salva a grade de 90 dias, que não
   cabe inteira nem no piso de compressão: partir por frente preserva o sentido,
   encolher até 1,3cqi não preserva a leitura. */
function tabelaHTML(t, linhas = t.linhas) {
  const th = t.cols.map((c, i) => `<th${i ? ` data-col="${i}"` : ''}>${esc(c)}</th>`).join('');
  const tr = linhas.map((l) =>
    `<tr>${l.map((c, i) => `<td${i ? ` data-col="${i}"` : ''}>${esc(c)}</td>`).join('')}</tr>`).join('');
  return `<table class="dk__tab"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
}

/* Cada beat é um PAINEL, não um acréscimo.

   Medido com _cabe.mjs: com os painéis empilhados, 22 das 23 cenas
   transbordavam a faixa do meio, algumas por 700px num espaço de 419. Não é
   questão de afinar corpo de texto — este conteúdo é documento, não slide, e
   cada slide de origem traz de três a seis blocos de prosa.

   Então o conteúdo passa PELO quadro em vez de se acumular nele: a manchete e
   o olho ficam, o painel troca. É o que um filme faz, é o que "só passo a
   passo" pede, e resolve a impressão de graça — o PDF emite uma página por
   beat em vez de uma por cena. */
function corpoHTML(c) {
  const paineis = [];
  const push = (html) => paineis.push(html);
  const olho = (t) => t ? `<p class="dk__olho" style="margin-bottom:1.4cqi">${esc(t)}</p>` : '';

  if (c.corpo) push(`<p class="dk__fecho">${c.corpo}</p>`);

  if (c.blocos) push(`<div class="dk__blocos" style="--cols:${Math.min(c.blocos.length, 2)}">` +
    c.blocos.map(([h, t]) => `<div class="dk__bloco"><h4>${esc(h)}</h4><p>${esc(t)}</p></div>`).join('') + '</div>');

  if (c.tabela) {
    const q = c.tabela.quebra;
    if (q) for (let i = 0; i < c.tabela.linhas.length; i += q)
      push(tabelaHTML(c.tabela, c.tabela.linhas.slice(i, i + q)));
    else push(tabelaHTML(c.tabela));
  }

  if (c.grade) push(`<div class="dk__grade" style="--cols:${c.cols || 3}">` +
    c.grade.map((g) => `<div class="dk__item"><h4>${esc(g.h)}</h4><p>${esc(g.p)}</p></div>`).join('') + '</div>');

  if (c.passos) push(olho(c.passosOlho) +
    `<ol class="dk__passos" style="--cols:${c.passos.length > 5 ? 2 : 1}">` +
    c.passos.map((x) => `<li>${esc(x)}</li>`).join('') + '</ol>');

  if (c.lista) push(olho(c.listaOlho) +
    `<ul class="dk__lista" style="--cols:${c.lista.length > 4 ? 2 : 1}">` +
    c.lista.map((x) => `<li>${esc(x)}</li>`).join('') + '</ul>');

  /* Duas listas = dois painéis, não duas colunas. Lado a lado elas competem
     pela mesma altura e a mais longa manda no fator de compressão das duas;
     em sequência cada uma respira, e a segunda vira um passo do argumento. */
  if (c.duasListas) {
    const d = c.duasListas;
    for (const [o, itens] of [[d.aOlho, d.a], [d.bOlho, d.b]])
      push(olho(o) + `<ul class="dk__lista" style="--cols:${itens.length > 5 ? 2 : 1}">` +
        itens.map((x) => `<li>${esc(x)}</li>`).join('') + '</ul>');
  }

  if (c.ativo) push(placa(c.ativo));
  if (c.fecho) push(`<p class="dk__fecho">${esc(c.fecho)}</p>`);
  if (c.legado) push(`<p class="dk__legado"><b>Legado.</b> ${esc(c.legado)}</p>`);

  /* Os painéis são absolutos DENTRO do próprio palco, não do meio inteiro:
     sem este invólucro eles cobrem também a linha da manchete, e o primeiro
     painel sai por cima do título. */
  return '<div class="dk__paineis">' +
    paineis.map((h, i) => `<div class="dk__painel" data-painel="${i}">${h}</div>`).join('') + '</div>';
}

const palco = document.getElementById('palco');

palco.innerHTML = CENAS.map((c, i) => {
  const campo = campoDaCena(c);
  const [bg, ink] = CAMPOS[campo] || CAMPOS.papel;
  const reg = c.registro ? REGISTRO_EDITORIAL[c.registro] : null;
  const estilo = () => `--slide-bg:${bg};--slide-ink:${ink}` + (c.acento ? `;--slide-acento:${c.acento}` : '') + larg;

  const olho = c.capa ? '' :
    `<p class="dk__olho">${reg ? `<strong>${esc(reg.rotulo)}</strong>` : ''}${reg && c.olho ? ' · ' : ''}${c.olho ? esc(c.olho) : ''}</p>`;

  const hedClasse = c.capa ? 'dk__hed'
    : (c.hed.length > 58 ? 'dk__hed dk__hed--peq' : 'dk__hed dk__hed--med');

  const topo = c.capa
    ? `<span class="cmc-lockup dk__lockup"><svg class="cmc-lockup__mark" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M32 12a20 20 0 1 0 0 40 20 20 0 0 0 19.6-16H41.2A10.5 10.5 0 1 1 41.2 28h10.4A20 20 0 0 0 32 12Z"/></svg><span class="cmc-lockup__word">${marca.name}</span></span>`
    : olho;

  /* Quanta largura o conteúdo pede decide quanta sobra para o grafismo.
     Tabela grande e grade grande são as que estouram o 16:9 primeiro. */
  const denso = !!c.tabela || !!c.grade || !!c.duasListas
    || (c.passos && c.passos.length > 6);
  const modo = c.modo || (c.sangria ? 'sangria' : denso ? 'borda' : 'faixa');
  /* Em sangria, a largura do tipo SAI da clareira declarada. Ajustar os dois
     à mão é como o grafismo volta a cruzar a tipografia: alguém mexe na
     clareira, esquece do texto, e o defeito reaparece três cenas depois.
     A clareira considerada é a MAIS ABERTA de todos os beats, não a do
     estado inicial: na cena 10 ela nasce fechada e abre, e medir pela
     fechada espremia o texto numa coluna de 31%. */
  let larg = '';
  if (c.sangria && c.arte) {
    let melhor = 0;
    for (let k = 0; k < (c.beats || [{}]).length; k++) {
      const cfg = arteNoBeat(c, k), cl = cfg && cfg.clareira && cfg.clareira[0];
      if (cl) melhor = Math.max(melhor, (cl.x + cl.w) - cl.soft * 0.5);
    }
    if (melhor) larg = `;--cl:${Math.max(0.3, melhor)}`;
  }
  const arte = c.arte ? '<div class="dk__art"><canvas aria-hidden="true"></canvas></div>' : '';

  return `<section class="dk__slide" data-i="${i}" data-campo="${campo}" data-arte="${modo}"
      ${c.registro ? `data-registro="${c.registro}"` : ''} style="${estilo()}">
    ${arte}
    <div>${topo}</div>
    <div class="dk__meio">
      <h2 class="${hedClasse}">${c.hed}</h2>
      ${corpoHTML(c)}
    </div>
    <div>
      <div class="dk__pe" style="margin-top:2cqi">
        <span>${esc(c.rodape || 'Plano de Gestão e IA da Banana Milk')}</span>
        <span>${String(c.n).padStart(2, '0')} / ${String(CENAS.length).padStart(2, '0')}</span>
      </div>
    </div>
  </section>`;
}).join('');

/* --- Ajuste medido ------------------------------------------------------

   Baixa --cp de cada painel até ele caber, com piso: abaixo de PISO o tipo
   deixa de ser legível projetado, e aí o problema é excesso de conteúdo, não
   de tamanho. Um painel que bate no piso e ainda transborda é registrado em
   `apEstouro` — o relatório de _cabe.mjs lê dali. Melhor um número do que uma
   barra de rolagem que ninguém vê no meio da apresentação. */
const PISO = 0.68;
const estouros = [];

function ajustarPainel(el) {
  el.style.setProperty('--cp', '1');
  if (el.scrollHeight <= el.clientHeight + 1) return;
  let cp = 1;
  while (cp > PISO) {
    cp = Math.round((cp - 0.04) * 100) / 100;
    el.style.setProperty('--cp', String(cp));
    if (el.scrollHeight <= el.clientHeight + 1) return;
  }
  estouros.push({ cena: el.closest('.dk__slide').dataset.i, sobra: el.scrollHeight - el.clientHeight });
}

/* Só mede painel visível: um painel escondido tem clientHeight zero. */
function ajustarCena(secao) {
  secao.querySelectorAll('.dk__painel').forEach((el) => {
    const tinha = el.hasAttribute('data-visivel');
    el.setAttribute('data-visivel', '');
    ajustarPainel(el);
    if (!tinha) el.removeAttribute('data-visivel');
  });
}

/* --- Navegação por beats -------------------------------------------------
   Uma seta avança um passo dentro da cena; no último passo, passa de cena.
   Voltar assenta no estado FINAL do passo anterior — nunca reproduz a
   animação de trás para frente, que é o que faz um deck parecer quebrado. */

/* Quantos passos a cena tem sai do DOM, não da declaração: o número de painéis
   é decidido na montagem (uma tabela com `quebra` vira vários, duasListas vira
   dois), e uma lista de beats escrita à mão ficaria defasada em silêncio —
   com painel inalcançável e ninguém percebendo até a apresentação. */
palco.querySelectorAll('.dk__slide').forEach((s, i) => {
  s.dataset.beats = String(1 + s.querySelectorAll('.dk__painel').length);
});
const passosDa = (i) => Number(palco.querySelector(`.dk__slide[data-i="${i}"]`).dataset.beats);

const regua = document.getElementById('regua');
regua.innerHTML = CENAS.map(() => '<i></i>').join('');
const conta = document.getElementById('conta');

let cena = 0, beat = 0, anterior = -1;

function aplicar(animar) {
  const c = CENAS[cena];
  const secao = palco.querySelector(`.dk__slide[data-i="${cena}"]`);

  palco.querySelectorAll('.dk__slide').forEach((s, k) => s.toggleAttribute('data-ativo', k === cena));
  regua.querySelectorAll('i').forEach((el, k) => {
    el.toggleAttribute('data-feito', k < cena);
    el.toggleAttribute('data-agora', k === cena);
  });
  conta.textContent = `${String(c.n).padStart(2, '0')} / ${String(CENAS.length).padStart(2, '0')}`;

  /* Um painel por vez: o beat 0 é o quadro só com a manchete, e a partir daí
     cada passo troca o painel. Cena sem painel nenhum fica na manchete. */
  const paineis = secao.querySelectorAll('.dk__painel');
  paineis.forEach((el, k) => el.toggleAttribute('data-visivel', k === beat - 1));
  if (!secao.dataset.ajustado) { ajustarCena(secao); secao.dataset.ajustado = '1'; }
  secao.querySelectorAll('[data-beat]').forEach((el) => {
    el.toggleAttribute('data-visivel', Number(el.dataset.beat) <= beat);
  });

  /* Tabela revelada coluna a coluna (slide 20). */
  const cols = c.beats.slice(0, beat + 1).reduce((m, b) => Math.max(m, b.colunas || 0), 0);
  secao.querySelectorAll('.dk__tab [data-col]').forEach((el) => {
    el.toggleAttribute('data-visivel', c.beats.some((b) => b.colunas) ? Number(el.dataset.col) <= cols : true);
  });

  /* Grafismo. */
  const cv = secao.querySelector('canvas');
  if (!cv) return;
  const alvo = arteNoBeat(c, beat);
  const passo = c.beats[beat];
  const mudou = animar && passo && passo.arte && cena === anterior;
  if (mudou) anima(cv, arteNoBeat(c, beat - 1), alvo, passo.ms || 1200);
  else { parar(cv); render(cv, alvo); }
  anterior = cena;
}

function ir(dc, db) {
  const c = CENAS[cena];
  if (db) {
    const n = beat + db;
    if (n >= 0 && n < passosDa(cena)) { beat = n; return aplicar(db > 0); }
    dc = db > 0 ? 1 : -1;
  }
  const nc = cena + dc;
  if (nc < 0 || nc >= CENAS.length) return;
  cena = nc;
  /* Entrando de trás para frente, cai no último passo da cena. */
  beat = db < 0 ? passosDa(cena) - 1 : 0;
  aplicar(false);
}

document.getElementById('proximo').addEventListener('click', () => ir(0, 1));
document.getElementById('anterior').addEventListener('click', () => ir(0, -1));
document.getElementById('tela').addEventListener('click', () => {
  (document.fullscreenElement ? document.exitFullscreen() : palco.requestFullscreen()).catch(() => {});
});
addEventListener('keydown', (e) => {
  if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); ir(0, 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); ir(0, -1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); ir(1, 0); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); ir(-1, 0); }
  else if (e.key === 'Home') { cena = 0; beat = 0; aplicar(false); }
  else if (e.key === 'End') { cena = CENAS.length - 1; beat = passosDa(cena) - 1; aplicar(false); }
  else if (e.key.toLowerCase() === 'f') document.getElementById('tela').click();
});
addEventListener('resize', () => aplicar(false));

/* Impressão: achata para o último beat de cada cena e desenha TODOS os
   grafismos, porque um slide escondido tem tamanho zero e sairia em branco. */
function achatar() {
  palco.querySelectorAll('.dk__slide').forEach((s, k) => {
    s.querySelectorAll('[data-beat]').forEach((el) => el.setAttribute('data-visivel', ''));
    s.querySelectorAll('.dk__tab [data-col]').forEach((el) => el.setAttribute('data-visivel', ''));
    const cv = s.querySelector('canvas');
    if (cv) { parar(cv); render(cv, arteNoBeat(CENAS[k], passosDa(k) - 1)); }
  });
}
addEventListener('beforeprint', achatar);
if (matchMedia('print').matches) achatar();

/* Visão de apresentador: notas de apoio e pendências. Não vão para a tela do
   cliente — são material de quem apresenta. */
if (params.get('notas')) {
  const el = document.getElementById('notas');
  el.hidden = false;
  el.innerHTML = '<h3>Notas de apoio</h3><ul class="cmc-small">' +
    CENAS.filter((c) => c.nota).map((c) =>
      `<li><strong>${String(c.n).padStart(2, '0')}</strong> · ${esc(c.nota)}</li>`).join('') +
    '</ul><h3 style="margin-top:2rem">Pendências antes da versão final</h3><ul class="cmc-small">' +
    PENDENCIAS.map((p) => `<li>${esc(p)}</li>`).join('') + '</ul>';
}

/* Modo captura: ?cena=N&beat=K abre direto num estado, para o exportador. */
if (params.get('cena')) {
  cena = Math.max(0, Math.min(CENAS.length - 1, Number(params.get('cena')) - 1));
  beat = Math.max(0, Math.min(passosDa(cena) - 1, Number(params.get('beat') || 0)));
}
/* Mede tudo na entrada: a navegação não pode gastar quadro medindo layout, e
   o relatório precisa das 23 cenas, não só da que está na tela. */
palco.querySelectorAll('.dk__slide').forEach((s) => {
  s.setAttribute('data-ativo', ''); ajustarCena(s); s.dataset.ajustado = '1';
  s.removeAttribute('data-ativo');
});
window.apEstouro = estouros;

aplicar(false);
init(palco);
palco.focus();
document.documentElement.dataset.apPronto = '1';
</script>
</body>
</html>
