<style>
/* ==========================================================================
   Camacho — Design Tokens
   Extraídos da exploração de identidade visual (moodboard, deck, pôster).
   Fonte única de verdade. Nada de valores soltos nos componentes.
   ========================================================================== */

:root {
  /* --- Cor ---------------------------------------------------------------
     A identidade é monocromática por convicção: preto puro, branco puro e
     uma escada de cinzas neutros. Sem cor de destaque — o destaque é o
     contraste e a densidade do dither. */
  --cmc-black:        #000000;   /* superfícies primárias, tinta */
  --cmc-ink:          #0A0A0A;   /* preto de tela, evita smear em OLED */
  --cmc-steel:        #3F3F3F;   /* painel escuro secundário (specimen tipográfico) */
  --cmc-grey-70:      #6E6E6E;
  --cmc-grey-55:      #8C8C8C;   /* numerais de processo, kickers */
  --cmc-grey-35:      #B5B5B5;
  --cmc-grey-20:      #D6D6D6;   /* réguas, bordas */
  --cmc-canvas:       #E4E4E4;   /* fundo de moodboard / plano de fundo institucional */
  --cmc-paper:        #F2F0EE;   /* papel do pôster, levemente quente */
  --cmc-white:        #FFFFFF;

  /* Papéis semânticos — use estes nos componentes */
  --cmc-bg:           var(--cmc-canvas);
  --cmc-surface:      var(--cmc-white);
  --cmc-surface-inv:  var(--cmc-black);
  --cmc-text:         var(--cmc-black);
  --cmc-text-muted:   var(--cmc-grey-55);
  --cmc-text-inv:     var(--cmc-white);
  --cmc-rule:         var(--cmc-grey-20);
  --cmc-particle:     var(--cmc-white);   /* dither sobre preto */
  --cmc-particle-inv: var(--cmc-black);   /* dither sobre claro */

  /* --- Tipografia --------------------------------------------------------
     Títulos em Light com tracking negativo: é o que dá o ar de engenharia
     calma que a marca precisa.
     Três vozes, um trabalho cada — e a regra que impede virar mingau:
     nunca competem no mesmo bloco.
       sistema   sustenta a marca e a interface, e amarra as outras duas
       editorial diagnóstico, artigo, material de formação — o lado humano
       medição   indicador, nível, rótulo de dado — o lado técnico */
  --cmc-font: "Inter Tight", "Inter", ui-sans-serif, system-ui,
              -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --cmc-font-serif: "Source Serif 4", ui-serif, Georgia, "Times New Roman", serif;
  --cmc-font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --cmc-w-light:  300;
  --cmc-w-book:   400;
  --cmc-w-medium: 500;

  /* Escala fluida (min → max entre 400px e 1600px) */
  --cmc-fs-display: clamp(3.5rem, 1.5rem + 8vw, 8rem);
  --cmc-fs-title:   clamp(2.25rem, 1.2rem + 4.2vw, 4.5rem);
  --cmc-fs-h1:      clamp(1.75rem, 1.1rem + 2.6vw, 3rem);
  --cmc-fs-h2:      clamp(1.375rem, 1rem + 1.5vw, 2rem);
  --cmc-fs-lead:    clamp(1.0625rem, 0.95rem + 0.6vw, 1.375rem);
  --cmc-fs-body:    1rem;
  --cmc-fs-small:   0.8125rem;
  --cmc-fs-micro:   0.6875rem;

  --cmc-lh-tight:   0.94;   /* display */
  --cmc-lh-snug:    1.08;   /* títulos */
  --cmc-lh-normal:  1.45;   /* texto corrido */

  --cmc-tr-display: -0.035em;
  --cmc-tr-title:   -0.025em;
  --cmc-tr-body:    -0.01em;
  --cmc-tr-micro:   0.02em;

  /* --- Espaçamento (base 4) --------------------------------------------- */
  --cmc-sp-1:  0.25rem;  --cmc-sp-2:  0.5rem;   --cmc-sp-3: 0.75rem;
  --cmc-sp-4:  1rem;     --cmc-sp-5:  1.5rem;   --cmc-sp-6: 2rem;
  --cmc-sp-7:  3rem;     --cmc-sp-8:  4rem;     --cmc-sp-9: 6rem;
  --cmc-sp-10: 8rem;

  --cmc-gutter: clamp(1.25rem, 3vw, 3rem);
  --cmc-measure: 62ch;          /* medida máxima de leitura */
  --cmc-max: 1440px;

  /* --- Forma -------------------------------------------------------------
     Raio grande e generoso, herdado do squircle da marca. */
  --cmc-r-mark:  22%;      /* proporcional ao lado — assinatura da marca */
  --cmc-r-card:  14px;
  --cmc-r-panel: 20px;
  --cmc-r-pill:  999px;

  --cmc-border: 1px solid var(--cmc-rule);

  /* Altura única de controle: é o que faz botão e tag alinharem lado a lado. */
  --cmc-control-h: 2.5rem;

  /* --- Elevação ----------------------------------------------------------
     Quase inexistente. A hierarquia vem de campo preto vs. campo claro. */
  --cmc-shadow-0: none;
  --cmc-shadow-1: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  --cmc-shadow-2: 0 2px 4px rgba(0,0,0,.08), 0 24px 60px rgba(0,0,0,.14);

  /* --- Níveis de maturidade ----------------------------------------------
     A marca é monocromática por argumento, não só por estética: num sistema
     que precisa comunicar NÍVEL (maturidade, prioridade, risco), o nível é
     codificado por densidade de partícula, não por matiz. Uma cor de destaque
     criaria um segundo sistema concorrendo com o motor gráfico.
     Estes valores alimentam `ramp` do dither e a opacidade de componentes. */
  --cmc-level-1: 0.10;   /* lacuna grande — quase nada instalado */
  --cmc-level-2: 0.30;
  --cmc-level-3: 0.52;
  --cmc-level-4: 0.76;
  --cmc-level-5: 1.00;   /* capacidade instalada e sustentada */

  /* --- Dither (o motor gráfico) ------------------------------------------
     Estes tokens governam o grafismo de partículas. */
  --cmc-cell: 4px;              /* aresta da célula da grade de partículas */
  --cmc-dither-min: 0.02;       /* densidade na ponta "ruído" */
  --cmc-dither-max: 1;          /* densidade na ponta "sinal" */
  --cmc-dither-jitter: 0.3;     /* deslocamento aleatório dentro da célula */

  /* --- Movimento ---------------------------------------------------------
     Uma curva só. Tudo resolve de ruído para forma. */
  --cmc-ease: cubic-bezier(.2,.7,.2,1);
  --cmc-dur-fast: 180ms;
  --cmc-dur-base: 420ms;
  --cmc-dur-slow: 900ms;
  --cmc-dur-resolve: 1600ms;    /* revelação do dither */

  --cmc-z-base: 0; --cmc-z-sticky: 100; --cmc-z-overlay: 500;
}

/* Campo escuro: inverte os papéis semânticos sem tocar na paleta. */
.cmc-inverse,
[data-cmc-field="dark"] {
  --cmc-bg:         var(--cmc-black);
  --cmc-surface:    var(--cmc-black);
  --cmc-text:       var(--cmc-white);
  --cmc-text-muted: var(--cmc-grey-55);
  --cmc-rule:       #2A2A2A;
  --cmc-particle:   var(--cmc-white);
}

</style>
<style>
/* ==========================================================================
   Camacho — Camada de componentes
   Depende de tokens/tokens.css. Nenhum valor mágico aqui.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cmc-bg);
  color: var(--cmc-text);
  font-family: var(--cmc-font);
  font-size: var(--cmc-fs-body);
  font-weight: var(--cmc-w-book);
  line-height: var(--cmc-lh-normal);
  letter-spacing: var(--cmc-tr-body);
  -webkit-font-smoothing: antialiased;
}

/* --- Tipografia ---------------------------------------------------------- */
.cmc-display, .cmc-title, .cmc-h1, .cmc-h2 {
  font-weight: var(--cmc-w-light);
  margin: 0;
  text-wrap: balance;
}
.cmc-display { font-size: var(--cmc-fs-display); line-height: var(--cmc-lh-tight); letter-spacing: var(--cmc-tr-display); }
.cmc-title   { font-size: var(--cmc-fs-title);   line-height: var(--cmc-lh-tight); letter-spacing: var(--cmc-tr-display); }
.cmc-h1      { font-size: var(--cmc-fs-h1);      line-height: var(--cmc-lh-snug);  letter-spacing: var(--cmc-tr-title); }
.cmc-h2      { font-size: var(--cmc-fs-h2);      line-height: var(--cmc-lh-snug);  letter-spacing: var(--cmc-tr-title); }
.cmc-lead    { font-size: var(--cmc-fs-lead);    line-height: 1.3; font-weight: var(--cmc-w-book); margin: 0; }
.cmc-body    { max-width: var(--cmc-measure); margin: 0; }
.cmc-body--justified { text-align: justify; hyphens: auto; }
/* Corpo do slide: empurrado para a base, para que slides vizinhos de alturas
   diferentes alinhem o rodapé. Justificado só quando a coluna é larga o
   bastante — abaixo disso o justificado abre rios e piora a leitura. */
.cmc-slide__body { margin: 0; margin-top: auto; }
@container (min-width: 26rem) {
  .cmc-slide__body { text-align: justify; hyphens: auto; }
}
.cmc-small   { font-size: var(--cmc-fs-small); color: var(--cmc-text-muted); }
.cmc-micro {
  font-size: var(--cmc-fs-micro);
  letter-spacing: var(--cmc-tr-micro);
  text-transform: uppercase;
  color: var(--cmc-text-muted);
  font-weight: var(--cmc-w-medium);
}
.cmc-muted { color: var(--cmc-text-muted); }

/* --- As três vozes -------------------------------------------------------
   Cada uma com um trabalho declarado. Elas se sucedem dentro de um bloco (o
   sistema abre, a editorial desenvolve), mas nunca disputam o mesmo papel:
   rótulo e número não vão em serifada, texto longo não vai em mono, e título
   de marca é sempre a voz de sistema. */
.cmc-editorial {
  font-family: var(--cmc-font-serif);
  font-size: var(--cmc-fs-lead);
  line-height: 1.6;
  letter-spacing: 0;
  max-width: var(--cmc-measure);
  margin: 0;
}
.cmc-editorial--lead { font-size: var(--cmc-fs-h2); line-height: 1.35; }
.cmc-measure {
  font-family: var(--cmc-font-mono);
  font-size: var(--cmc-fs-small);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}
.cmc-measure--big {
  font-size: var(--cmc-fs-h1);
  font-weight: var(--cmc-w-book);
  line-height: 1;
}

/* --- Marca ---------------------------------------------------------------
   O lockup é mark + wordmark com um espaço fixo proporcional à altura.
   Área de proteção = metade da altura da marca em todos os lados. */
.cmc-lockup {
  display: inline-flex;
  align-items: center;
  gap: 0.34em;
  font-size: var(--lockup-size, 2rem);
  line-height: 1;
  color: inherit;          /* herda o campo; nunca fixa preto sobre preto */
  text-decoration: none;
}
.cmc-lockup__mark { width: 1em; height: 1em; flex: none; display: block; }
/* O glifo sem o squircle ocupa menos da caixa, então compensa opticamente
   para pesar igual ao símbolo completo ao lado do wordmark. */
.cmc-lockup--glyph .cmc-lockup__mark { width: 1.14em; height: 1.14em; }
.cmc-lockup__word {
  font-size: 1em;
  font-weight: var(--cmc-w-medium);
  letter-spacing: -0.035em;
}
.cmc-lockup--sm { --lockup-size: 1.125rem; }
.cmc-lockup--lg { --lockup-size: clamp(2.5rem, 6vw, 5rem); }

/* --- Estrutura ----------------------------------------------------------- */
.cmc-shell { max-width: var(--cmc-max); margin-inline: auto; padding-inline: var(--cmc-gutter); }
.cmc-section { padding-block: var(--cmc-sp-9); }
.cmc-rule { border: 0; border-top: var(--cmc-border); margin: 0; }
.cmc-grid { display: grid; gap: var(--cmc-sp-5); }
.cmc-grid--2 { grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); }
.cmc-grid--3 { grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); }

/* Cabeçalho de seção: rótulo à esquerda, numeral à direita. */
.cmc-section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--cmc-sp-4); padding-bottom: var(--cmc-sp-3);
  border-bottom: var(--cmc-border); margin-bottom: var(--cmc-sp-6);
}

/* --- Slide de processo ---------------------------------------------------
   O componente-assinatura do deck: título + numeral, painel preto com o
   grafismo, linha de chamada, kicker à direita e corpo em cinza. */
.cmc-slide {
  background: var(--cmc-surface);
  border-radius: var(--cmc-r-card);
  padding: clamp(1.25rem, 2.4vw, 2rem);
  display: flex; flex-direction: column; gap: var(--cmc-sp-4);
  container-type: inline-size;
}
.cmc-slide__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--cmc-sp-4); }
/* Título e numeral escalam com a LARGURA DO CARD, não da viewport: é o que
   impede um título longo ("Transform") de encostar no numeral. */
.cmc-slide .cmc-title,
.cmc-slide .cmc-slide__num { font-size: clamp(1.5rem, 13cqi, 3.25rem); }
.cmc-slide .cmc-title { min-width: 0; overflow-wrap: break-word; }
.cmc-slide .cmc-slide__num { flex: none; }
.cmc-slide__num {
  font-size: var(--cmc-fs-title);
  font-weight: var(--cmc-w-light);
  letter-spacing: var(--cmc-tr-display);
  color: var(--cmc-grey-35);
  line-height: var(--cmc-lh-tight);
  font-variant-numeric: tabular-nums;
}
.cmc-slide__stage {
  background: var(--cmc-black);
  aspect-ratio: 16 / 6;
  width: 100%;
  color: var(--cmc-particle);   /* o canvas herda daqui */
  overflow: hidden;
}
.cmc-slide__stage canvas { display: block; width: 100%; height: 100%; }
.cmc-slide__caption { display: flex; align-items: baseline; justify-content: space-between; gap: var(--cmc-sp-4); }
@container (max-width: 420px) {
  .cmc-slide__caption { flex-direction: column; gap: var(--cmc-sp-1); }
}

/* --- Palco de grafismo genérico ------------------------------------------ */
.cmc-stage {
  position: relative;
  background: var(--cmc-black);
  color: var(--cmc-particle);
  border-radius: var(--cmc-r-panel);
  overflow: hidden;
  aspect-ratio: var(--stage-ar, 16 / 9);
}
.cmc-stage--light { background: var(--cmc-paper); color: var(--cmc-particle-inv); }
.cmc-stage--flat { border-radius: 0; }
.cmc-stage--bare { background: transparent; }
.cmc-stage canvas { display: block; width: 100%; height: 100%; }

/* --- Card ---------------------------------------------------------------- */
.cmc-card {
  background: var(--cmc-surface);
  border-radius: var(--cmc-r-card);
  padding: var(--cmc-sp-5);
  display: flex; flex-direction: column; gap: var(--cmc-sp-3);
}
.cmc-card--outline { background: transparent; border: var(--cmc-border); }

/* --- Botão ---------------------------------------------------------------
   Pílula. Sólida em preto, ou contorno. Sem gradiente, nunca. */
.cmc-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--cmc-sp-2);
  min-height: var(--cmc-control-h); padding: 0 1.35em;
  border-radius: var(--cmc-r-pill);
  border: 1px solid transparent;
  background: var(--cmc-black); color: var(--cmc-white);
  font: inherit; font-weight: var(--cmc-w-medium); font-size: var(--cmc-fs-small);
  letter-spacing: var(--cmc-tr-body);
  cursor: pointer; text-decoration: none;
  transition: transform var(--cmc-dur-fast) var(--cmc-ease),
              background-color var(--cmc-dur-fast) var(--cmc-ease),
              color var(--cmc-dur-fast) var(--cmc-ease);
}
.cmc-btn:hover { transform: translateY(-1px); }
.cmc-btn:active { transform: translateY(0); }
.cmc-btn:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
/* O contorno herda a cor do campo em que está: assim o mesmo botão funciona
   sobre branco e sobre preto sem variante extra. */
.cmc-btn--ghost {
  background: transparent; color: inherit;
  border-color: color-mix(in srgb, currentColor 32%, transparent);
}
.cmc-btn--ghost:hover { border-color: currentColor; }
.cmc-btn--inverse { background: var(--cmc-white); color: var(--cmc-black); }

/* --- Tag / pílula informativa -------------------------------------------- */
.cmc-tag {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--cmc-sp-2);
  min-height: var(--cmc-control-h); padding: 0 0.95em;
  border-radius: var(--cmc-r-pill);
  border: 1px solid currentColor;
  font-size: var(--cmc-fs-micro); letter-spacing: var(--cmc-tr-micro);
  text-transform: uppercase; font-weight: var(--cmc-w-medium);
  text-decoration: none; color: inherit;
}
a.cmc-tag:hover { background: currentColor; }
a.cmc-tag:hover > * { color: var(--cmc-bg); }

/* Fila de controles: botões e tags dividem a mesma altura e alinham. */
.cmc-controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cmc-sp-2); }
.cmc-controls--split { justify-content: space-between; }

/* --- Swatches ------------------------------------------------------------ */
.cmc-swatch { display: flex; flex-direction: column; gap: var(--cmc-sp-2); }
.cmc-swatch__chip {
  aspect-ratio: 3 / 2; border-radius: var(--cmc-r-card);
  border: var(--cmc-border); background: var(--chip);
}
.cmc-swatch__meta { display: flex; justify-content: space-between; gap: var(--cmc-sp-2); }

/* --- Pôster / peça de campanha ------------------------------------------- */
.cmc-poster {
  background: var(--cmc-paper); color: var(--cmc-black);
  aspect-ratio: 3 / 4; padding: clamp(1rem, 3cqi, 2.25rem);
  display: grid; grid-template-rows: auto 1fr auto; gap: var(--cmc-sp-4);
  container-type: inline-size; box-shadow: var(--cmc-shadow-2);
}
.cmc-poster__head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--cmc-sp-4); }
.cmc-poster__hed { text-align: right; font-size: clamp(1.5rem, 9cqi, 4rem); }
.cmc-poster__art { position: relative; color: var(--cmc-particle-inv); }
.cmc-poster__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cmc-poster__foot { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--cmc-sp-4); }

/* --- Do / Don't ---------------------------------------------------------- */
.cmc-rule-card { display: flex; flex-direction: column; gap: var(--cmc-sp-3); }
.cmc-rule-card__flag { font-weight: var(--cmc-w-medium); display: flex; align-items: center; gap: var(--cmc-sp-2); }
.cmc-rule-card--do .cmc-rule-card__flag::before { content: "＋"; }
.cmc-rule-card--dont .cmc-rule-card__flag::before { content: "−"; }
.cmc-rule-card--dont { color: var(--cmc-text-muted); }

/* --- Acessibilidade ------------------------------------------------------ */
:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

/* --- Key visual ----------------------------------------------------------
   Uma composição em três faixas — assinatura, grafismo, manchete — que vale
   para qualquer proporção. O grafismo ocupa a faixa do meio e cresce com o
   que sobra, e como todo campo do motor é ciente de proporção, a mesma peça
   se recompõe de 21:9 a 9:16 sem layout alternativo.

   Tudo escala a partir de UMA medida por formato (--kv-base), em cqi.

   Duas armadilhas de unidade, ambas encontradas na renderização:
   1. cqmin não serve — com container-type inline-size o eixo de bloco não é
      consultável e a unidade degenera.
   2. Um elemento NÃO pode usar as próprias unidades de container: em cqi
      declarado e usado no mesmo .cmc-kv, a medida resolve contra um ancestral
      (ou o viewport) e o padding estoura, esmagando a coluna. Por isso a
      grade mora num filho: lá dentro, cqi resolve contra o KV. */
.cmc-kv {
  --kv-base: 8cqi;
  position: relative;
  overflow: hidden;
  aspect-ratio: var(--kv-ar, 16 / 9);
  background: var(--kv-bg, var(--cmc-black));
  color: var(--kv-ink, var(--cmc-white));
  container-type: inline-size;
}
.cmc-kv__inner {
  position: absolute; inset: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: calc(var(--kv-base) * 0.42);
  padding: calc(var(--kv-base) * 0.62);
}
.cmc-kv__art { position: relative; min-height: 0; min-width: 0; }
.cmc-kv__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* A manchete é o ponto onde o registro de direção de arte fala: família, peso
   e tracking entram como propriedade da peça, pelo mesmo mecanismo de
   --kv-base. Nenhuma classe nova — trocar a voz é trocar três valores. */
.cmc-kv__hed {
  margin: 0;

/* Onde o grafismo mora.

   exatamente o defeito que a clareira existe para impedir, e que a versão

   resolve: ela só deixa os dois igualmente fracos.

   Então há dois modos, e nenhum deles é "atrás de tudo":

              tipo senta. Só onde o grafismo É o argumento.

.dk__slide[data-arte="borda"] .dk__art { inset: 0 0 0 auto; width: 7%; }
.dk__slide[data-arte="borda"] > :not(.dk__art) { max-width: 89%; }
.dk__slide[data-arte="borda"] .dk__hed { font-size: 3.1cqi; }
.dk__slide[data-arte="sangria"] .dk__art { inset: 0; }

/* pé — a arte toma uma faixa inferior de largura inteira, como LINHA do grid e
   não como camada absoluta. É o modo do campo `intervalo`, e não é gosto: o
   campo é um eixo de tempo, e numa coluna de 34% ele sai cortado — as três
   barras de "onde o vão é maior" perdiam justamente a comparação que são.

   As linhas são explícitas nos quatro filhos. Deixar o grid posicionar sozinho

   repositório já cometeu em .cmc-kv--sangria e corrigiu do mesmo jeito. */

.dk__bloco h4 { margin: 0; font-family: var(--cmc-font-mono); font-size: calc(1.6cqi * var(--cp, 1));
                letter-spacing: 0.06em; text-transform: uppercase;
                font-weight: var(--cmc-w-medium);
                color: color-mix(in srgb, currentColor 55%, transparent); }
.dk__bloco p { margin: 0; font-size: calc(2.1cqi * var(--cp, 1)); line-height: 1.45; }

/* Tabela de duas ou quatro colunas. Regra fina, nada de zebra: o sistema
   separa por espaço e linha, não por preenchimento. */
.dk__tab { width: 100%; border-collapse: collapse; font-size: calc(1.95cqi * var(--cp, 1)); }
.dk__tab th {
  text-align: left; font-family: var(--cmc-font-mono); font-size: calc(1.55cqi * var(--cp, 1));
  letter-spacing: 0.06em; text-transform: uppercase;
  font-weight: var(--cmc-w-medium); padding: 0 1.6cqi calc(1.2cqi * var(--cp, 1)) 0;
  color: color-mix(in srgb, currentColor 55%, transparent);
  border-bottom: 1px solid color-mix(in srgb, currentColor 30%, transparent);
}
.dk__tab td { padding: calc(1.15cqi * var(--cp, 1)) 1.6cqi calc(1.15cqi * var(--cp, 1)) 0; vertical-align: top; line-height: 1.35;
              border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
.dk__tab tr td:first-child { width: 26%; }
.dk__tab td[data-col]:not([data-visivel]) { opacity: 0; }
.dk__tab td[data-col] { transition: opacity var(--cmc-dur-base) var(--cmc-ease); }

/* Passos numerados: a numeração é do sistema (mono, tabular), não do browser. */
.dk__passos { list-style: none; margin: 0; padding: 0; counter-reset: p;
              display: grid; gap: calc(1.1cqi * var(--cp, 1)); grid-template-columns: repeat(var(--cols, 2), 1fr); }
.dk__passos li { counter-increment: p; display: flex; gap: 1.2cqi;
                 font-size: calc(2cqi * var(--cp, 1)); line-height: 1.35; }
.dk__passos li::before {
  content: counter(p, decimal-leading-zero); flex: none;
  font-family: var(--cmc-font-mono); font-size: calc(1.6cqi * var(--cp, 1));
  font-variant-numeric: tabular-nums; padding-top: 0.25cqi;
  color: color-mix(in srgb, currentColor 45%, transparent);
}

/* Lista simples, marcada por regra e não por bolinha. */
.dk__lista { list-style: none; margin: 0; padding: 0;
             display: grid; gap: calc(0.9cqi * var(--cp, 1)); grid-template-columns: repeat(var(--cols, 2), 1fr); }
.dk__lista li { font-size: calc(2cqi * var(--cp, 1)); line-height: 1.35; padding-left: 2.2cqi; position: relative; }
.dk__lista li::before {
  content: ""; position: absolute; left: 0; top: 1.1cqi;
  width: 1.2cqi; height: 1px; background: currentColor; opacity: 0.45;
}

/* Fecho: a frase que o slide deixa. Serifada no diagnóstico, sistema no resto
   — quem decide é o registro, e é isso que impede a peça de virar um bloco só. */
.dk__fecho { margin: 0; font-size: calc(2.4cqi * var(--cp, 1)); line-height: 1.4; max-width: 62ch; }
.dk__slide[data-registro="diagnostico"] .dk__fecho {
  font-family: var(--cmc-font-serif); font-size: calc(2.7cqi * var(--cp, 1));
}
.dk__legado {
  margin: 0; font-size: calc(2cqi * var(--cp, 1)); line-height: 1.4; padding-left: 2.4cqi;
  border-left: 2px solid color-mix(in srgb, currentColor 35%, transparent);
}

/* Placa de ativo que ainda não chegou. Um retângulo vazio passa despercebido
   até a peça estar na frente do cliente; uma placa que diz qual arquivo falta,
   não. */
.dk__placa {
  display: inline-flex; flex-direction: column; gap: 0.5cqi;
  padding: calc(1.8cqi * var(--cp, 1)); min-height: 0; align-self: start;
  border: 1px dashed color-mix(in srgb, currentColor 40%, transparent);
  background: color-mix(in srgb, currentColor 6%, transparent);
  font-family: var(--cmc-font-mono); font-size: 1.6cqi;
}
.dk__placa b { font-weight: var(--cmc-w-medium); }
.dk__placa span { color: color-mix(in srgb, currentColor 60%, transparent); }

/* Barra de progresso da apresentação: uma régua, não um enfeite. */
.dk__regua { display: flex; gap: 0.3cqi; flex: 1; align-items: center; }
.dk__regua i { flex: 1; height: 2px; background: currentColor; opacity: 0.18; }
.dk__regua i[data-feito] { opacity: 0.55; }
.dk__regua i[data-agora] { opacity: 1; height: 4px; }

/* Visão de apresentador: notas de apoio e pendências, fora da tela do cliente. */
.dk__notas { max-width: 46rem; margin-inline: auto; padding-block: var(--cmc-sp-6); }
.dk__notas h3 { font-size: var(--cmc-fs-h3); margin: 0 0 var(--cmc-sp-3); }
.dk__notas li { margin-bottom: var(--cmc-sp-3); line-height: 1.5; }

@media print {
  /* Impressão achata os beats: sem isso metade de cada página sai em branco. */
  /* --cp é o fator de compressão do painel: um escalar só, do qual todo tamanho
   de tipo e todo respiro dentro do painel derivam — mesmo mecanismo de
   --kv-base em .cmc-kv. A página mede o painel e baixa o fator até caber,
   com piso declarado. Assim "não coube" é um número no relatório, não uma
   barra de rolagem que ninguém vê durante a apresentação. */
.dk__painel {
  --cp: 1;
  position: absolute; inset: 0; overflow: hidden;
  opacity: 0; visibility: hidden;
  transition: opacity var(--cmc-dur-base) var(--cmc-ease);
}
.dk__painel[data-visivel] { opacity: 1; visibility: visible; }
.dk__paineis { position: relative; min-height: 0; }

.dk__slide [data-beat] { opacity: 1 !important; visibility: visible !important; }
  .dk__tab td[data-col] { opacity: 1 !important; }
  .dk__meio { overflow: visible; }
  .dk__notas, .dk__regua { display: none; }
}

/* ==========================================================================
   Proposta — documento para ler e imprimir
   ========================================================================== */
.pr { max-width: 46rem; margin-inline: auto; }
.pr__capa {
  display: flex; flex-direction: column; gap: var(--cmc-sp-5);
  padding-block: var(--cmc-sp-8);
  border-bottom: 2px solid var(--cmc-black);
}
.pr__art { position: relative; aspect-ratio: 16/5; }
.pr__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pr__sec { padding-block: var(--cmc-sp-7); border-bottom: var(--cmc-border); }
.pr__rot {
  font-family: var(--cmc-font-mono); font-size: var(--cmc-fs-small);
  color: var(--cmc-text-muted); margin: 0 0 var(--cmc-sp-4);
}
/* Peças do documento do assessment. Reusam .pr__sec/.pr__rot/.pr__tabela; o
   que entra aqui é só o que o texto do assessment pede a mais. */
.pr__olho {
  font-family: var(--cmc-font-mono); font-size: var(--cmc-fs-micro);
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--cmc-ink-3); margin: var(--cmc-sp-5) 0 var(--cmc-sp-3);
}
.pr__bloco { margin-block: var(--cmc-sp-5); }
.pr__bloco h3 {
  font-family: var(--cmc-font-mono); font-size: var(--cmc-fs-micro);
  letter-spacing: 0.06em; text-transform: uppercase;
  font-weight: var(--cmc-w-medium); color: var(--cmc-ink-3);
  margin: 0 0 var(--cmc-sp-2);
}
.pr__bloco p { margin: 0; line-height: 1.6; }
.pr__lista, .pr__passos { margin: 0 0 var(--cmc-sp-4); padding: 0; list-style: none; }
.pr__lista li, .pr__passos li { line-height: 1.55; margin-bottom: var(--cmc-sp-2); }
.pr__lista li { padding-left: var(--cmc-sp-5); position: relative; }
.pr__lista li::before {
  content: ""; position: absolute; left: 0; top: 0.72em;
  width: var(--cmc-sp-4); height: 1px; background: currentColor; opacity: 0.4;
}
.pr__passos { counter-reset: pr; }
.pr__passos li { counter-increment: pr; padding-left: var(--cmc-sp-6); position: relative; }
.pr__passos li::before {
  content: counter(pr, decimal-leading-zero); position: absolute; left: 0;
  font-family: var(--cmc-font-mono); font-size: var(--cmc-fs-micro);
  font-variant-numeric: tabular-nums; color: var(--cmc-ink-3); top: 0.25em;
}
/* Barra do sabor: o acento identifica o programa, e não pinta o fundo. */
.pr__passos--prog li[style*="--prog"] { border-left: 3px solid var(--prog); padding-left: var(--cmc-sp-5); }
.pr__passos--prog li::before { content: none; }
.pr__rot[data-prog] { color: var(--prog); }
.pr__sec[style*="--prog"] { border-left: 3px solid var(--prog); padding-left: var(--cmc-sp-5); }

.pr__legado {
  margin: var(--cmc-sp-5) 0 0; padding-left: var(--cmc-sp-5);
  border-left: 2px solid var(--cmc-ink-3); line-height: 1.55;
}
/* Nota do assessment: interpretação, não achado. Marcada para ninguém
   confundir as duas — é uma exigência da regra editorial do documento. */
.pr__nota {
  margin: var(--cmc-sp-5) 0 0; padding: var(--cmc-sp-4);
  background: var(--cmc-paper); font-size: var(--cmc-fs-small); line-height: 1.55;
}

.pr__tabela { width: 100%; border-collapse: collapse; font-size: var(--cmc-fs-small); }
.pr__tabela th {
  text-align: left; font-weight: var(--cmc-w-medium); padding: var(--cmc-sp-3) 0;
  border-bottom: 1px solid var(--cmc-black);
}
.pr__tabela td { padding: var(--cmc-sp-3) 0; border-bottom: var(--cmc-border); vertical-align: top; }
.pr__tabela td:last-child, .pr__tabela th:last-child {
  text-align: right; font-family: var(--cmc-font-mono); font-variant-numeric: tabular-nums;
}

@media print {
  @page { size: A4; margin: 18mm 16mm; }
  body { background: #fff; }
  .naoimprime { display: none !important; }
  .pr { max-width: none; }
  .pr__sec { break-inside: avoid; padding-block: 8mm; }
  .pr__capa { break-after: page; }
}

/* ==========================================================================
   Carrossel de LinkedIn — documento, não imagem
   A plataforma publica carrossel como PDF, então a peça é um documento de
   páginas 4:5 e o "export" é imprimir. Cada página é uma ideia.
   ========================================================================== */
.cr { max-width: 34rem; margin-inline: auto; display: flex; flex-direction: column; gap: var(--cmc-sp-5); }
.cr__pag {
  aspect-ratio: 4 / 5; container-type: inline-size; overflow: hidden;
  border-radius: var(--cmc-r-card);
  background: var(--pag-bg, var(--cmc-black)); color: var(--pag-ink, var(--cmc-white));
  position: relative;
}
.cr__inner {
  position: absolute; inset: 0; display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto; gap: 4cqi; padding: 7cqi;
}
.cr__hed { font-size: 9cqi; line-height: 0.98; letter-spacing: -0.03em;
           font-weight: var(--cmc-w-light); margin: 0; text-wrap: balance; }
.cr__corpo { font-size: 3.6cqi; line-height: 1.45; margin: 0;
             color: color-mix(in srgb, currentColor 68%, transparent); }
.cr__corpo--serif { font-family: var(--cmc-font-serif); font-size: 3.9cqi; }
.cr__art { position: relative; min-height: 0; }
.cr__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cr__pe { display: flex; justify-content: space-between; align-items: flex-end; gap: 4cqi;
          font-family: var(--cmc-font-mono); font-size: 2.6cqi;
          color: color-mix(in srgb, currentColor 60%, transparent); }
.cr__lockup { --lockup-size: 5.5cqi; }

@media print {
  @page { size: 1080px 1350px; margin: 0; }
  body { background: #fff; }
  .cr { max-width: none; gap: 0; display: block; }
  .cr__pag { width: 1080px; height: 1350px; aspect-ratio: auto;
             border-radius: 0; break-after: page; }
  .cr__pag:last-child { break-after: auto; }
}

/* Deck impresso: um slide por página, paisagem. É o caminho real de virar PDF. */
@media print {
  .dk__barra, .dk + p, body.dk > .cmc-shell > p { display: none; }
  .dk__palco { aspect-ratio: auto; }
  .dk__slide {
    position: relative; inset: auto; opacity: 1; visibility: visible;
    width: 1600px; height: 900px; break-after: page;
  }
  .dk__slide:last-child { break-after: auto; }
}

<style>
/* ==========================================================================
   Camacho — Design Tokens
   Extraídos da exploração de identidade visual (moodboard, deck, pôster).
   Fonte única de verdade. Nada de valores soltos nos componentes.
   ========================================================================== */

:root {
  /* --- Cor ---------------------------------------------------------------
     A identidade é monocromática por convicção: preto puro, branco puro e
     uma escada de cinzas neutros. Sem cor de destaque — o destaque é o
     contraste e a densidade do dither. */
  --cmc-black:        #000000;   /* superfícies primárias, tinta */
  --cmc-ink:          #0A0A0A;   /* preto de tela, evita smear em OLED */
  --cmc-steel:        #3F3F3F;   /* painel escuro secundário (specimen tipográfico) */
  --cmc-grey-70:      #6E6E6E;
  --cmc-grey-55:      #8C8C8C;   /* numerais de processo, kickers */
  --cmc-grey-35:      #B5B5B5;
  --cmc-grey-20:      #D6D6D6;   /* réguas, bordas */
  --cmc-canvas:       #E4E4E4;   /* fundo de moodboard / plano de fundo institucional */
  --cmc-paper:        #F2F0EE;   /* papel do pôster, levemente quente */
  --cmc-white:        #FFFFFF;

  /* Papéis semânticos — use estes nos componentes */
  --cmc-bg:           var(--cmc-canvas);
  --cmc-surface:      var(--cmc-white);
  --cmc-surface-inv:  var(--cmc-black);
  --cmc-text:         var(--cmc-black);
  --cmc-text-muted:   var(--cmc-grey-55);
  --cmc-text-inv:     var(--cmc-white);
  --cmc-rule:         var(--cmc-grey-20);
  --cmc-particle:     var(--cmc-white);   /* dither sobre preto */
  --cmc-particle-inv: var(--cmc-black);   /* dither sobre claro */

  /* --- Tipografia --------------------------------------------------------
     Títulos em Light com tracking negativo: é o que dá o ar de engenharia
     calma que a marca precisa.
     Três vozes, um trabalho cada — e a regra que impede virar mingau:
     nunca competem no mesmo bloco.
       sistema   sustenta a marca e a interface, e amarra as outras duas
       editorial diagnóstico, artigo, material de formação — o lado humano
       medição   indicador, nível, rótulo de dado — o lado técnico */
  --cmc-font: "Inter Tight", "Inter", ui-sans-serif, system-ui,
              -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --cmc-font-serif: "Source Serif 4", ui-serif, Georgia, "Times New Roman", serif;
  --cmc-font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --cmc-w-light:  300;
  --cmc-w-book:   400;
  --cmc-w-medium: 500;

  /* Escala fluida (min → max entre 400px e 1600px) */
  --cmc-fs-display: clamp(3.5rem, 1.5rem + 8vw, 8rem);
  --cmc-fs-title:   clamp(2.25rem, 1.2rem + 4.2vw, 4.5rem);
  --cmc-fs-h1:      clamp(1.75rem, 1.1rem + 2.6vw, 3rem);
  --cmc-fs-h2:      clamp(1.375rem, 1rem + 1.5vw, 2rem);
  --cmc-fs-lead:    clamp(1.0625rem, 0.95rem + 0.6vw, 1.375rem);
  --cmc-fs-body:    1rem;
  --cmc-fs-small:   0.8125rem;
  --cmc-fs-micro:   0.6875rem;

  --cmc-lh-tight:   0.94;   /* display */
  --cmc-lh-snug:    1.08;   /* títulos */
  --cmc-lh-normal:  1.45;   /* texto corrido */

  --cmc-tr-display: -0.035em;
  --cmc-tr-title:   -0.025em;
  --cmc-tr-body:    -0.01em;
  --cmc-tr-micro:   0.02em;

  /* --- Espaçamento (base 4) --------------------------------------------- */
  --cmc-sp-1:  0.25rem;  --cmc-sp-2:  0.5rem;   --cmc-sp-3: 0.75rem;
  --cmc-sp-4:  1rem;     --cmc-sp-5:  1.5rem;   --cmc-sp-6: 2rem;
  --cmc-sp-7:  3rem;     --cmc-sp-8:  4rem;     --cmc-sp-9: 6rem;
  --cmc-sp-10: 8rem;

  --cmc-gutter: clamp(1.25rem, 3vw, 3rem);
  --cmc-measure: 62ch;          /* medida máxima de leitura */
  --cmc-max: 1440px;

  /* --- Forma -------------------------------------------------------------
     Raio grande e generoso, herdado do squircle da marca. */
  --cmc-r-mark:  22%;      /* proporcional ao lado — assinatura da marca */
  --cmc-r-card:  14px;
  --cmc-r-panel: 20px;
  --cmc-r-pill:  999px;

  --cmc-border: 1px solid var(--cmc-rule);

  /* Altura única de controle: é o que faz botão e tag alinharem lado a lado. */
  --cmc-control-h: 2.5rem;

  /* --- Elevação ----------------------------------------------------------
     Quase inexistente. A hierarquia vem de campo preto vs. campo claro. */
  --cmc-shadow-0: none;
  --cmc-shadow-1: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  --cmc-shadow-2: 0 2px 4px rgba(0,0,0,.08), 0 24px 60px rgba(0,0,0,.14);

  /* --- Níveis de maturidade ----------------------------------------------
     A marca é monocromática por argumento, não só por estética: num sistema
     que precisa comunicar NÍVEL (maturidade, prioridade, risco), o nível é
     codificado por densidade de partícula, não por matiz. Uma cor de destaque
     criaria um segundo sistema concorrendo com o motor gráfico.
     Estes valores alimentam `ramp` do dither e a opacidade de componentes. */
  --cmc-level-1: 0.10;   /* lacuna grande — quase nada instalado */
  --cmc-level-2: 0.30;
  --cmc-level-3: 0.52;
  --cmc-level-4: 0.76;
  --cmc-level-5: 1.00;   /* capacidade instalada e sustentada */

  /* --- Dither (o motor gráfico) ------------------------------------------
     Estes tokens governam o grafismo de partículas. */
  --cmc-cell: 4px;              /* aresta da célula da grade de partículas */
  --cmc-dither-min: 0.02;       /* densidade na ponta "ruído" */
  --cmc-dither-max: 1;          /* densidade na ponta "sinal" */
  --cmc-dither-jitter: 0.3;     /* deslocamento aleatório dentro da célula */

  /* --- Movimento ---------------------------------------------------------
     Uma curva só. Tudo resolve de ruído para forma. */
  --cmc-ease: cubic-bezier(.2,.7,.2,1);
  --cmc-dur-fast: 180ms;
  --cmc-dur-base: 420ms;
  --cmc-dur-slow: 900ms;
  --cmc-dur-resolve: 1600ms;    /* revelação do dither */

  --cmc-z-base: 0; --cmc-z-sticky: 100; --cmc-z-overlay: 500;
}

/* Campo escuro: inverte os papéis semânticos sem tocar na paleta. */
.cmc-inverse,
[data-cmc-field="dark"] {
  --cmc-bg:         var(--cmc-black);
  --cmc-surface:    var(--cmc-black);
  --cmc-text:       var(--cmc-white);
  --cmc-text-muted: var(--cmc-grey-55);
  --cmc-rule:       #2A2A2A;
  --cmc-particle:   var(--cmc-white);
}

<style>
/* ==========================================================================
   Camacho — Camada de componentes
   Depende de tokens/tokens.css. Nenhum valor mágico aqui.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cmc-bg);
  color: var(--cmc-text);
  font-family: var(--cmc-font);
  font-size: var(--cmc-fs-body);
  font-weight: var(--cmc-w-book);
  line-height: var(--cmc-lh-normal);
  letter-spacing: var(--cmc-tr-body);
  -webkit-font-smoothing: antialiased;
}

/* --- Tipografia ---------------------------------------------------------- */
.cmc-display, .cmc-title, .cmc-h1, .cmc-h2 {
  font-weight: var(--cmc-w-light);
  margin: 0;
  text-wrap: balance;
}
.cmc-display { font-size: var(--cmc-fs-display); line-height: var(--cmc-lh-tight); letter-spacing: var(--cmc-tr-display); }
.cmc-title   { font-size: var(--cmc-fs-title);   line-height: var(--cmc-lh-tight); letter-spacing: var(--cmc-tr-display); }
.cmc-h1      { font-size: var(--cmc-fs-h1);      line-height: var(--cmc-lh-snug);  letter-spacing: var(--cmc-tr-title); }
.cmc-h2      { font-size: var(--cmc-fs-h2);      line-height: var(--cmc-lh-snug);  letter-spacing: var(--cmc-tr-title); }

.cmc-body--justified { text-align: justify; hyphens: auto; }
/* Corpo do slide: empurrado para a base, para que slides vizinhos de alturas

/* --- As três vozes -------------------------------------------------------
   Cada uma com um trabalho declarado. Elas se sucedem dentro de um bloco (o
   sistema abre, a editorial desenvolve), mas nunca disputam o mesmo papel:
   rótulo e número não vão em serifada, texto longo não vai em mono, e título
   de marca é sempre a voz de sistema. */
.cmc-editorial {
  font-family: var(--cmc-font-serif);
  font-size: var(--cmc-fs-lead);
  line-height: 1.6;
  letter-spacing: 0;

  font-size: var(--cmc-fs-h1);
  font-weight: var(--cmc-w-book);

/* --- Marca ---------------------------------------------------------------
   O lockup é mark + wordmark com um espaço fixo proporcional à altura.
   Área de proteção = metade da altura da marca em todos os lados. */
.cmc-lockup {
  display: inline-flex;
  align-items: center;
  gap: 0.34em;
  font-size: var(--lockup-size, 2rem);
  line-height: 1;
  color: inherit;          /* herda o campo; nunca fixa preto sobre preto */
  text-decoration: none;
}
.cmc-lockup__mark { width: 1em; height: 1em; flex: none; display: block; }
/* O glifo sem o squircle ocupa menos da caixa, então compensa opticamente
   para pesar igual ao símbolo completo ao lado do wordmark. */
.cmc-lockup--glyph .cmc-lockup__mark { width: 1.14em; height: 1.14em; }
.cmc-lockup__word {
  font-size: 1em;
  font-weight: var(--cmc-w-medium);
  letter-spacing: -0.035em;
}
.cmc-lockup--sm { --lockup-size: 1.125rem; }
.cmc-lockup--lg { --lockup-size: clamp(2.5rem, 6vw, 5rem); }

/* --- Estrutura ----------------------------------------------------------- */
.cmc-shell { max-width: var(--cmc-max); margin-inline: auto; padding-inline: var(--cmc-gutter); }
.cmc-section { padding-block: var(--cmc-sp-9); }
.cmc-rule { border: 0; border-top: var(--cmc-border); margin: 0; }
.cmc-grid { display: grid; gap: var(--cmc-sp-5); }
.cmc-grid--2 { grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); }

  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--cmc-sp-4); padding-bottom: var(--cmc-sp-3);
  border-bottom: var(--cmc-border); margin-bottom: var(--cmc-sp-6);
}

/* --- Slide de processo ---------------------------------------------------
   O componente-assinatura do deck: título + numeral, painel preto com o
   grafismo, linha de chamada, kicker à direita e corpo em cinza. */
.cmc-slide {
  background: var(--cmc-surface);
  border-radius: var(--cmc-r-card);
  padding: clamp(1.25rem, 2.4vw, 2rem);
  display: flex; flex-direction: column; gap: var(--cmc-sp-4);
  container-type: inline-size;
}
.cmc-slide__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--cmc-sp-4); }
/* Título e numeral escalam com a LARGURA DO CARD, não da viewport: é o que
   impede um título longo ("Transform") de encostar no numeral. */
.cmc-slide .cmc-title,
.cmc-slide .cmc-slide__num { font-size: clamp(1.5rem, 13cqi, 3.25rem); }
.cmc-slide .cmc-title { min-width: 0; overflow-wrap: break-word; }
.cmc-slide .cmc-slide__num { flex: none; }
.cmc-slide__num {
  font-size: var(--cmc-fs-title);
  font-weight: var(--cmc-w-light);
  letter-spacing: var(--cmc-tr-display);
  color: var(--cmc-grey-35);
  line-height: var(--cmc-lh-tight);
  font-variant-numeric: tabular-nums;
}
.cmc-slide__stage {
  background: var(--cmc-black);
  aspect-ratio: 16 / 6;
  width: 100%;
  color: var(--cmc-particle);   /* o canvas herda daqui */
  overflow: hidden;
}
.cmc-slide__stage canvas { display: block; width: 100%; height: 100%; }
.cmc-slide__caption { display: flex; align-items: baseline; justify-content: space-between; gap: var(--cmc-sp-4); }
@container (max-width: 420px) {
  .cmc-slide__caption { flex-direction: column; gap: var(--cmc-sp-1); }
}

/* --- Palco de grafismo genérico ------------------------------------------ */
.cmc-stage {
  position: relative;
  background: var(--cmc-black);
  color: var(--cmc-particle);
  border-radius: var(--cmc-r-panel);
  overflow: hidden;
  aspect-ratio: var(--stage-ar, 16 / 9);
}
.cmc-stage--light { background: var(--cmc-paper); color: var(--cmc-particle-inv); }
.cmc-stage--flat { border-radius: 0; }
.cmc-stage--bare { background: transparent; }
.cmc-stage canvas { display: block; width: 100%; height: 100%; }

/* --- Card ---------------------------------------------------------------- */
.cmc-card {
  background: var(--cmc-surface);
  border-radius: var(--cmc-r-card);
  padding: var(--cmc-sp-5);
  display: flex; flex-direction: column; gap: var(--cmc-sp-3);
}
.cmc-card--outline { background: transparent; border: var(--cmc-border); }

/* --- Botão ---------------------------------------------------------------
   Pílula. Sólida em preto, ou contorno. Sem gradiente, nunca. */
.cmc-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--cmc-sp-2);
  min-height: var(--cmc-control-h); padding: 0 1.35em;
  border-radius: var(--cmc-r-pill);
  border: 1px solid transparent;
  background: var(--cmc-black); color: var(--cmc-white);
  font: inherit; font-weight: var(--cmc-w-medium); font-size: var(--cmc-fs-small);
  letter-spacing: var(--cmc-tr-body);
  cursor: pointer; text-decoration: none;
  transition: transform var(--cmc-dur-fast) var(--cmc-ease),
              background-color var(--cmc-dur-fast) var(--cmc-ease),
              color var(--cmc-dur-fast) var(--cmc-ease);
}
.cmc-btn:hover { transform: translateY(-1px); }
.cmc-btn:active { transform: translateY(0); }
.cmc-btn:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
/* O contorno herda a cor do campo em que está: assim o mesmo botão funciona
   sobre branco e sobre preto sem variante extra. */
.cmc-btn--ghost {
  background: transparent; color: inherit;
  border-color: color-mix(in srgb, currentColor 32%, transparent);
}
.cmc-btn--ghost:hover { border-color: currentColor; }
.cmc-btn--inverse { background: var(--cmc-white); color: var(--cmc-black); }

/* --- Tag / pílula informativa -------------------------------------------- */
.cmc-tag {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--cmc-sp-2);
  min-height: var(--cmc-control-h); padding: 0 0.95em;
  border-radius: var(--cmc-r-pill);
  border: 1px solid currentColor;
  font-size: var(--cmc-fs-micro); letter-spacing: var(--cmc-tr-micro);
  text-transform: uppercase; font-weight: var(--cmc-w-medium);
  text-decoration: none; color: inherit;
}
a.cmc-tag:hover { background: currentColor; }
a.cmc-tag:hover > * { color: var(--cmc-bg); }

/* Fila de controles: botões e tags dividem a mesma altura e alinham. */
.cmc-controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cmc-sp-2); }
.cmc-controls--split { justify-content: space-between; }

/* --- Swatches ------------------------------------------------------------ */
.cmc-swatch { display: flex; flex-direction: column; gap: var(--cmc-sp-2); }
.cmc-swatch__chip {
  aspect-ratio: 3 / 2; border-radius: var(--cmc-r-card);
  border: var(--cmc-border); background: var(--chip);
}
.cmc-swatch__meta { display: flex; justify-content: space-between; gap: var(--cmc-sp-2); }

/* --- Pôster / peça de campanha ------------------------------------------- */
.cmc-poster {
  background: var(--cmc-paper); color: var(--cmc-black);
  aspect-ratio: 3 / 4; padding: clamp(1rem, 3cqi, 2.25rem);
  display: grid; grid-template-rows: auto 1fr auto; gap: var(--cmc-sp-4);
  container-type: inline-size; box-shadow: var(--cmc-shadow-2);
}
.cmc-poster__head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--cmc-sp-4); }
.cmc-poster__hed { text-align: right; font-size: clamp(1.5rem, 9cqi, 4rem); }
.cmc-poster__art { position: relative; color: var(--cmc-particle-inv); }
.cmc-poster__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cmc-poster__foot { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--cmc-sp-4); }

/* --- Do / Don't ---------------------------------------------------------- */
.cmc-rule-card { display: flex; flex-direction: column; gap: var(--cmc-sp-3); }
.cmc-rule-card__flag { font-weight: var(--cmc-w-medium); display: flex; align-items: center; gap: var(--cmc-sp-2); }
.cmc-rule-card--do .cmc-rule-card__flag::before { content: "＋"; }
.cmc-rule-card--dont .cmc-rule-card__flag::before { content: "−"; }
.cmc-rule-card--dont { color: var(--cmc-text-muted); }

/* --- Acessibilidade ------------------------------------------------------ */
:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

/* --- Key visual ----------------------------------------------------------
   Uma composição em três faixas — assinatura, grafismo, manchete — que vale
   para qualquer proporção. O grafismo ocupa a faixa do meio e cresce com o
   que sobra, e como todo campo do motor é ciente de proporção, a mesma peça
   se recompõe de 21:9 a 9:16 sem layout alternativo.

   Tudo escala a partir de UMA medida por formato (--kv-base), em cqi.

   Duas armadilhas de unidade, ambas encontradas na renderização:
   1. cqmin não serve — com container-type inline-size o eixo de bloco não é
      consultável e a unidade degenera.
   2. Um elemento NÃO pode usar as próprias unidades de container: em cqi
      declarado e usado no mesmo .cmc-kv, a medida resolve contra um ancestral
      (ou o viewport) e o padding estoura, esmagando a coluna. Por isso a
      grade mora num filho: lá dentro, cqi resolve contra o KV. */
.cmc-kv {
  --kv-base: 8cqi;
  position: relative;
  overflow: hidden;
  aspect-ratio: var(--kv-ar, 16 / 9);
  background: var(--kv-bg, var(--cmc-black));
  color: var(--kv-ink, var(--cmc-white));
  container-type: inline-size;
}
.cmc-kv__inner {
  position: absolute; inset: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: calc(var(--kv-base) * 0.42);
  padding: calc(var(--kv-base) * 0.62);
}
.cmc-kv__art { position: relative; min-height: 0; min-width: 0; }
.cmc-kv__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* A manchete é o ponto onde o registro de direção de arte fala: família, peso
   e tracking entram como propriedade da peça, pelo mesmo mecanismo de
   --kv-base. Nenhuma classe nova — trocar a voz é trocar três valores. */
.cmc-kv__hed {
  margin: 0;
  font-family: var(--kv-voz, var(--cmc-font));
  font-size: calc(var(--kv-base) * var(--kv-hed, 1));
  line-height: 0.96;
  letter-spacing: var(--kv-track, -0.035em);
  font-weight: var(--kv-peso, var(--cmc-w-light));
  text-wrap: balance;
}
/* O bloco de texto precisa de gap proporcional como o resto da peça: um
   `gap` em rem é absoluto e desaparece numa peça de 2560 px, ao mesmo tempo
   que domina uma miniatura. */
.cmc-kv__copy {
  display: flex; flex-direction: column;
  gap: calc(var(--kv-base) * 0.34);
}
.cmc-kv__pe {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: calc(var(--kv-base) * 0.5);
}
.cmc-kv__apoio {
  margin: 0; max-width: 42ch;
  font-size: calc(var(--kv-base) * 0.30); line-height: 1.35;
  color: color-mix(in srgb, currentColor 62%, transparent);
}
.cmc-kv__url {
  font-family: var(--cmc-font-mono);
  font-size: calc(var(--kv-base) * 0.25); flex: none;
}
.cmc-kv__lockup { --lockup-size: calc(var(--kv-base) * 0.58); }

/* Campo sangrado: o grafismo ocupa TODAS as faixas e a tipografia senta por
   cima. Isso é o oposto da regra que gerou este componente — e só é legítimo
   porque a `clareira` do motor faz a densidade desabar onde o texto vai. Não
   há partícula sob o tipo para cruzar. Sem clareira, isto é exatamente o
   remendo de z-index que falhou na primeira versão da galeria de formatos.

   A ordem de pintura segue a ordem do DOM, e a arte é o segundo filho — então
   ela cobriria o lockup. O z-index nos irmãos é o que devolve a ordem. */
.cmc-kv--sangria .cmc-kv__art { grid-area: 1 / 1 / -1 / -1; }
/* Os irmãos precisam de posição EXPLÍCITA. Sem isso o auto-placement do grid
   não os encaixa em células já ocupadas pela arte: ele cria linhas novas
   embaixo, e a peça vira arte em cima com assinatura e manchete penduradas
   fora dela. */
.cmc-kv--sangria .cmc-kv__lockup { grid-area: 1 / 1; }
.cmc-kv--sangria .cmc-kv__copy   { grid-area: 3 / 1; }
.cmc-kv--sangria .cmc-kv__inner > :not(.cmc-kv__art) { position: relative; z-index: 1; }

/* Peça muda: o grafismo é a manchete, então não existe faixa de manchete e a
   arte fica com a altura toda entre assinatura e pé. */
.cmc-kv--muda .cmc-kv__copy { display: contents; }

  color: var(--cmc-particle); border-radius: 4px; overflow: hidden;
}
.st-etapa__marca canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* --- Prova: o que sai do diagnóstico -------------------------------------- */
.st-prova { display: grid; gap: var(--cmc-sp-4); }
.st-nivel { display: grid; grid-template-columns: minmax(9rem, 1fr) minmax(0, 3fr) auto;
            gap: var(--cmc-sp-4); align-items: center; }
@media (max-width: 44rem) { .st-nivel { grid-template-columns: 1fr; gap: var(--cmc-sp-2); } }
.st-nivel__barra { position: relative; height: 2rem; background: var(--cmc-black);
                   border-radius: 3px; overflow: hidden; color: var(--cmc-white); }
.st-nivel__barra canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.st-nivel__v { font-family: var(--cmc-font-mono); font-size: var(--cmc-fs-small);
               color: var(--cmc-text-muted); font-variant-numeric: tabular-nums; }

/* --- Recusa: o que não sou ------------------------------------------------ */
.st-recusa { display: flex; flex-wrap: wrap; gap: var(--cmc-sp-2); }
.st-recusa span {
  font-size: var(--cmc-fs-small); padding: 0.45em 0.9em;
  border: var(--cmc-border); border-radius: var(--cmc-r-pill);
  color: var(--cmc-text-muted); text-decoration: line-through;
  text-decoration-color: color-mix(in srgb, currentColor 45%, transparent);
}

/* --- Fecho ---------------------------------------------------------------- */
.st-fecho { display: grid; gap: var(--cmc-sp-6); max-width: 24ch; }
.st-fecho__hed { font-size: clamp(2.4rem, 6vw, 5rem); line-height: 0.98;
                 letter-spacing: -0.035em; font-weight: var(--cmc-w-light); margin: 0; }
.st-rodape { border-top: var(--cmc-border); padding-block: var(--cmc-sp-6); }
.st-rodape__inner { display: flex; flex-wrap: wrap; gap: var(--cmc-sp-5);
                    justify-content: space-between; align-items: center; }

/* ==========================================================================
   Deck — slides navegáveis
   ========================================================================== */
.dk { background: var(--cmc-black); color: var(--cmc-white); }
.dk__palco {
  position: relative; width: 100%; aspect-ratio: 16/9;
  container-type: inline-size; overflow: hidden;
}
.dk__slide {
  position: absolute; inset: 0;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 3cqi; padding: 6cqi;
  background: var(--slide-bg, var(--cmc-black));
  color: var(--slide-ink, var(--cmc-white));
  opacity: 0; visibility: hidden;
  transition: opacity var(--cmc-dur-base) var(--cmc-ease);
}
.dk__slide[data-ativo] { opacity: 1; visibility: visible; }
.dk__hed { font-size: 7cqi; line-height: 0.98; letter-spacing: -0.03em;
           font-weight: var(--cmc-w-light); margin: 0; text-wrap: balance; }
.dk__hed--grande { font-size: 11cqi; }
.dk__corpo { font-size: 2.6cqi; line-height: 1.5; margin: 0; max-width: 46ch; }
.dk__corpo--serif { font-family: var(--cmc-font-serif); font-size: 2.9cqi; }
.dk__art { position: relative; min-height: 0; }
.dk__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.dk__pe { display: flex; justify-content: space-between; align-items: flex-end;
          gap: 3cqi; font-family: var(--cmc-font-mono); font-size: 1.8cqi;
          color: color-mix(in srgb, currentColor 60%, transparent); }
.dk__lockup { --lockup-size: 4cqi; }
.dk__grade { display: grid; gap: calc(3cqi * var(--cp, 1)); grid-template-columns: repeat(var(--cols, 3), 1fr); align-content: center; }
.dk__item { display: flex; flex-direction: column; gap: calc(1cqi * var(--cp, 1)); }
.dk__item h4 { margin: 0; font-size: calc(3.4cqi * var(--cp, 1)); font-weight: var(--cmc-w-light); letter-spacing: -0.02em; }
.dk__item p { margin: 0; font-size: calc(2.1cqi * var(--cp, 1)); line-height: 1.45;
              color: color-mix(in srgb, currentColor 66%, transparent); }
.dk__barra {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--cmc-sp-4); padding-block: var(--cmc-sp-4);
}
.dk__conta { font-family: var(--cmc-font-mono); font-size: var(--cmc-fs-small);
             font-variant-numeric: tabular-nums; }

/* ==========================================================================
   Apresentação — o deck de cliente, sobre a mesma máquina do .dk

   Reusa .dk__palco, .dk__slide, .dk__hed e a navegação inteira. O que entra
   aqui é só o que a peça de diagnóstico pede a mais: os beats, os quatro
   registros, o campo do cliente e as placas de ativo que ainda não chegou.
   ========================================================================== */

/* Onde o grafismo mora.

   A primeira versão desta página jogou a arte sangrada atrás de tudo com
   opacity 0.5, e a manchete da capa ficou ilegível na ponta densa. É
   exatamente o defeito que a clareira existe para impedir, e que a versão
   anterior de .format__frame já tinha cometido com z-index. Opacidade não
   resolve: ela só deixa os dois igualmente fracos.

   Então há dois modos, e nenhum deles é "atrás de tudo":

   sangria  — a arte ocupa a peça toda, e a cena DECLARA a clareira em que o
              tipo senta. Só onde o grafismo É o argumento.
   faixa    — a arte ocupa uma coluna à direita, o tipo tem a esquerda inteira.
   borda    — uma tira estreita na margem. Para cena com tabela de sete linhas
              ou grade de oito itens, em que qualquer coisa maior rouba a
              largura de que o conteúdo precisa. O modo sai da densidade do
              conteúdo, não do gosto: é medida, não decoração. */
/* Nada de `position: relative` aqui: .dk__slide já é absolute/inset:0 acima, e
   redeclarar tirava o slide do lugar e jogava a cena para fora do palco. */
.dk__slide .dk__art { position: absolute; z-index: 0; }
.dk__slide[data-arte="faixa"] .dk__art { inset: 0 0 0 auto; width: 34%; }
.dk__slide[data-arte="faixa"] > :not(.dk__art) { max-width: 62%; }
.dk__slide[data-arte="borda"] .dk__art { inset: 0 0 0 auto; width: 7%; }
.dk__slide[data-arte="borda"] > :not(.dk__art) { max-width: 89%; }
.dk__slide[data-arte="borda"] .dk__hed { font-size: 3.1cqi; }
.dk__slide[data-arte="sangria"] .dk__art { inset: 0; }

/* pé — a arte toma uma faixa inferior de largura inteira, como LINHA do grid e
   não como camada absoluta. É o modo do campo `intervalo`, e não é gosto: o
   campo é um eixo de tempo, e numa coluna de 34% ele sai cortado — as três
   barras de "onde o vão é maior" perdiam justamente a comparação que são.

   As linhas são explícitas nos quatro filhos. Deixar o grid posicionar sozinho
   joga a arte para a linha 1 e cria linhas novas no fim — defeito que este
   repositório já cometeu em .cmc-kv--sangria e corrigiu do mesmo jeito. */
/* 15cqi: varrido contra o transbordo. Em 22 seis paradas estouravam, em 18
   três, em 15 nenhuma. Abaixo disso a faixa só perde altura sem ganhar nada. */
.dk__slide[data-arte="pe"] { grid-template-rows: auto minmax(0, 1fr) 15cqi auto; }
.dk__slide[data-arte="pe"] .dk__art { position: relative; inset: auto; grid-row: 3; }
/* Rótulo de cada linha do eixo, em mono, na margem esquerda. */
.dk__eixo {
  position: absolute; inset: 0; z-index: 1; display: grid;
  grid-auto-rows: 1fr; align-items: center;
  font-family: var(--cmc-font-mono); font-size: 1.7cqi;
  color: color-mix(in srgb, currentColor 55%, transparent);
  pointer-events: none;
}
/* Onde há rótulo, o eixo começa depois dele — senão a marca do primeiro evento
   cai em cima do texto. */
.dk__art:has(.dk__eixo) canvas { left: 9cqi; width: calc(100% - 9cqi); }
.dk__slide[data-arte="pe"] > :nth-child(2) { grid-row: 1; }
.dk__slide[data-arte="pe"] .dk__meio { grid-row: 2; }
.dk__slide[data-arte="pe"] > :last-child { grid-row: 4; }
/* --cl vem da clareira declarada pela cena: o tipo não passa da borda do
   terreno limpo, por construção e não por conferência visual. */
.dk__slide[data-arte="sangria"] > :not(.dk__art) { max-width: calc(var(--cl, 1) * 100%); }
.dk__slide > :not(.dk__art) { position: relative; z-index: 1; }

/* A abertura: roda sozinha uma vez, antes da primeira parada, e para. */
.dk__abertura {
  position: absolute; inset: 0; z-index: 3; background: var(--cmc-black);
  display: grid; place-items: center;
}
.dk__abertura[hidden] { display: none; }
.dk__abertura canvas { position: absolute; inset: 0; width: 100%; height: 100%; color: #fff; }
.dk__abertura__leg {
  position: relative; margin: 0; align-self: end; margin-bottom: 9cqi;
  font-family: var(--cmc-font-mono); font-size: 2cqi; letter-spacing: 0.04em;
  text-transform: uppercase; color: #fff; opacity: 0;
  transition: opacity var(--cmc-dur-base) var(--cmc-ease);
}
.dk__abertura__leg[data-visivel] { opacity: 1; }

/* Os quatro programas carregam o acento do sabor correspondente. Barra à
   esquerda, não fundo colorido: o acento identifica, não decora, e o campo
   continua sendo o creme compartilhado pelas duas marcas. */
.dk__bloco--prog { padding-left: calc(1.6cqi * var(--cp, 1));
                   border-left: 3px solid var(--prog, currentColor); }
.dk__bloco--prog h4 { color: var(--prog, currentColor); }

/* Beats. Um elemento com data-beat só aparece quando o beat corrente o
   alcançou. `visibility` em vez de `display` para o layout não pular: a
   manchete tem que ficar no mesmo lugar do primeiro ao último passo. */
/* --cp é o fator de compressão do painel: um escalar só, do qual todo tamanho
   de tipo e todo respiro dentro do painel derivam — mesmo mecanismo de
   --kv-base em .cmc-kv. A página mede o painel e baixa o fator até caber,
   com piso declarado. Assim "não coube" é um número no relatório, não uma
   barra de rolagem que ninguém vê durante a apresentação. */
.dk__painel {
  --cp: 1;
  position: absolute; inset: 0; overflow: hidden;
  opacity: 0; visibility: hidden;
  transition: opacity var(--cmc-dur-base) var(--cmc-ease);
}
.dk__painel[data-visivel] { opacity: 1; visibility: visible; }
.dk__paineis { position: relative; min-height: 0; }

.dk__slide [data-beat] {
  opacity: 0; visibility: hidden;
  transition: opacity var(--cmc-dur-base) var(--cmc-ease);
}
.dk__slide [data-beat][data-visivel] { opacity: 1; visibility: visible; }

/* Campo do cliente: o mesmo creme do papel — as duas marcas já dividem o
   terreno — mais um acento por sabor, que vive na peça e não na fundação. */
.dk__slide[data-campo="cliente"] { --slide-bg: #F2F0EE; --slide-ink: #000; }
.dk__slide[data-campo="cliente"] .dk__olho,
.dk__slide[data-campo="cliente"] .dk__num { color: var(--slide-acento); }
.dk__slide[data-campo="cliente"] .dk__item h4 { color: var(--slide-acento); }

/* Olho: o rótulo do registro, sempre em mono, sempre no topo. É ele que diz
   se o slide é diagnóstico, recomendação, implementação ou legado — e é a
   única coisa da peça que não muda de lugar nunca. */
.dk__olho {
  font-family: var(--cmc-font-mono); font-size: 1.7cqi;
  letter-spacing: 0.06em; text-transform: uppercase; margin: 0;
  color: color-mix(in srgb, currentColor 55%, transparent);
}
.dk__olho strong { font-weight: var(--cmc-w-medium); color: currentColor; }

/* Manchete de cena de conteúdo é menor do que a de deck comercial, e isso é
   medido: com 5,2cqi em três linhas, o palco dos painéis perdia altura demais
   e seis cenas batiam no piso de compressão. Aqui a manchete cede espaço para
   o argumento, que é o que o cliente veio ler. */
.dk__hed--med { font-size: 4cqi; }
.dk__hed--peq { font-size: 3.3cqi; }
.dk__slide[data-arte] { gap: 2.2cqi; padding: 5cqi 6cqi; }

/* Corpo rolável: alguns slides têm mais conteúdo do que 16:9 comporta, e o
   certo é a faixa do meio rolar em vez de a peça inteira estourar. */
/* A faixa do meio é um palco de painéis: a manchete tem linha própria, e os
   painéis se sobrepõem no espaço que sobra, um visível de cada vez. */
.dk__meio { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 2.4cqi; }

/* Blocos rotulados — situação / diagnóstico / implicação. */
.dk__blocos { display: grid; gap: calc(2.2cqi * var(--cp, 1)); grid-template-columns: repeat(var(--cols, 2), 1fr); }
.dk__bloco { display: flex; flex-direction: column; gap: calc(0.8cqi * var(--cp, 1)); }
.dk__bloco h4 { margin: 0; font-family: var(--cmc-font-mono); font-size: calc(1.6cqi * var(--cp, 1));
                letter-spacing: 0.06em; text-transform: uppercase;
                font-weight: var(--cmc-w-medium);
                color: color-mix(in srgb, currentColor 55%, transparent); }
.dk__bloco p { margin: 0; font-size: calc(2.1cqi * var(--cp, 1)); line-height: 1.45; }

/* Tabela de duas ou quatro colunas. Regra fina, nada de zebra: o sistema
   separa por espaço e linha, não por preenchimento. */
.dk__tab { width: 100%; border-collapse: collapse; font-size: calc(1.95cqi * var(--cp, 1)); }
.dk__tab th {
  text-align: left; font-family: var(--cmc-font-mono); font-size: calc(1.55cqi * var(--cp, 1));
  letter-spacing: 0.06em; text-transform: uppercase;
  font-weight: var(--cmc-w-medium); padding: 0 1.6cqi calc(1.2cqi * var(--cp, 1)) 0;
  color: color-mix(in srgb, currentColor 55%, transparent);
  border-bottom: 1px solid color-mix(in srgb, currentColor 30%, transparent);
}
.dk__tab td { padding: calc(1.15cqi * var(--cp, 1)) 1.6cqi calc(1.15cqi * var(--cp, 1)) 0; vertical-align: top; line-height: 1.35;
              border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
.dk__tab tr td:first-child { width: 26%; }
.dk__tab td[data-col]:not([data-visivel]) { opacity: 0; }
.dk__tab td[data-col] { transition: opacity var(--cmc-dur-base) var(--cmc-ease); }

/* Passos numerados: a numeração é do sistema (mono, tabular), não do browser. */
.dk__passos { list-style: none; margin: 0; padding: 0; counter-reset: p;
              display: grid; gap: calc(1.1cqi * var(--cp, 1)); grid-template-columns: repeat(var(--cols, 2), 1fr); }
.dk__passos li { counter-increment: p; display: flex; gap: 1.2cqi;
                 font-size: calc(2cqi * var(--cp, 1)); line-height: 1.35; }
.dk__passos li::before {
  content: counter(p, decimal-leading-zero); flex: none;
  font-family: var(--cmc-font-mono); font-size: calc(1.6cqi * var(--cp, 1));
  font-variant-numeric: tabular-nums; padding-top: 0.25cqi;
  color: color-mix(in srgb, currentColor 45%, transparent);
}

/* Lista simples, marcada por regra e não por bolinha. */
.dk__lista { list-style: none; margin: 0; padding: 0;
             display: grid; gap: calc(0.9cqi * var(--cp, 1)); grid-template-columns: repeat(var(--cols, 2), 1fr); }
.dk__lista li { font-size: calc(2cqi * var(--cp, 1)); line-height: 1.35; padding-left: 2.2cqi; position: relative; }
.dk__lista li::before {
  content: ""; position: absolute; left: 0; top: 1.1cqi;
  width: 1.2cqi; height: 1px; background: currentColor; opacity: 0.45;
}

/* Fecho: a frase que o slide deixa. Serifada no diagnóstico, sistema no resto
   — quem decide é o registro, e é isso que impede a peça de virar um bloco só. */
.dk__fecho { margin: 0; font-size: calc(2.4cqi * var(--cp, 1)); line-height: 1.4; max-width: 62ch; }
.dk__slide[data-registro="diagnostico"] .dk__fecho {
  font-family: var(--cmc-font-serif); font-size: calc(2.7cqi * var(--cp, 1));
}
.dk__legado {
  margin: 0; font-size: calc(2cqi * var(--cp, 1)); line-height: 1.4; padding-left: 2.4cqi;
  border-left: 2px solid color-mix(in srgb, currentColor 35%, transparent);
}

/* Placa de ativo que ainda não chegou. Um retângulo vazio passa despercebido
   até a peça estar na frente do cliente; uma placa que diz qual arquivo falta,
   não. */
.dk__placa {
  display: inline-flex; flex-direction: column; gap: 0.5cqi;
  padding: calc(1.8cqi * var(--cp, 1)); min-height: 0; align-self: start;
  border: 1px dashed color-mix(in srgb, currentColor 40%, transparent);
  background: color-mix(in srgb, currentColor 6%, transparent);
  font-family: var(--cmc-font-mono); font-size: 1.6cqi;
}
.dk__placa b { font-weight: var(--cmc-w-medium); }
.dk__placa span { color: color-mix(in srgb, currentColor 60%, transparent); }

/* Barra de progresso da apresentação: uma régua, não um enfeite. */
.dk__regua { display: flex; gap: 0.3cqi; flex: 1; align-items: center; }
.dk__regua i { flex: 1; height: 2px; background: currentColor; opacity: 0.18; }
.dk__regua i[data-feito] { opacity: 0.55; }
.dk__regua i[data-agora] { opacity: 1; height: 4px; }

/* Visão de apresentador: notas de apoio e pendências, fora da tela do cliente. */
.dk__notas { max-width: 46rem; margin-inline: auto; padding-block: var(--cmc-sp-6); }
.dk__notas h3 { font-size: var(--cmc-fs-h3); margin: 0 0 var(--cmc-sp-3); }
.dk__notas li { margin-bottom: var(--cmc-sp-3); line-height: 1.5; }

@media print {
  /* Impressão achata os beats: sem isso metade de cada página sai em branco. */
  /* --cp é o fator de compressão do painel: um escalar só, do qual todo tamanho
   de tipo e todo respiro dentro do painel derivam — mesmo mecanismo de
   --kv-base em .cmc-kv. A página mede o painel e baixa o fator até caber,
   com piso declarado. Assim "não coube" é um número no relatório, não uma
   barra de rolagem que ninguém vê durante a apresentação. */
.dk__painel {
  --cp: 1;
  position: absolute; inset: 0; overflow: hidden;
  opacity: 0; visibility: hidden;
  transition: opacity var(--cmc-dur-base) var(--cmc-ease);
}
.dk__painel[data-visivel] { opacity: 1; visibility: visible; }
.dk__paineis { position: relative; min-height: 0; }

.dk__slide [data-beat] { opacity: 1 !important; visibility: visible !important; }
  .dk__tab td[data-col] { opacity: 1 !important; }
  .dk__meio { overflow: visible; }
  .dk__notas, .dk__regua { display: none; }
}

/* ==========================================================================
   Proposta — documento para ler e imprimir
   ========================================================================== */
.pr { max-width: 46rem; margin-inline: auto; }
.pr__capa {
  display: flex; flex-direction: column; gap: var(--cmc-sp-5);
  padding-block: var(--cmc-sp-8);
  border-bottom: 2px solid var(--cmc-black);
}
.pr__art { position: relative; aspect-ratio: 16/5; }
.pr__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pr__sec { padding-block: var(--cmc-sp-7); border-bottom: var(--cmc-border); }
.pr__rot {
  font-family: var(--cmc-font-mono); font-size: var(--cmc-fs-small);
  color: var(--cmc-text-muted); margin: 0 0 var(--cmc-sp-4);
}
/* Peças do documento do assessment. Reusam .pr__sec/.pr__rot/.pr__tabela; o
   que entra aqui é só o que o texto do assessment pede a mais. */
.pr__olho {
  font-family: var(--cmc-font-mono); font-size: var(--cmc-fs-micro);
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--cmc-ink-3); margin: var(--cmc-sp-5) 0 var(--cmc-sp-3);
}
.pr__bloco { margin-block: var(--cmc-sp-5); }
.pr__bloco h3 {
  font-family: var(--cmc-font-mono); font-size: var(--cmc-fs-micro);
  letter-spacing: 0.06em; text-transform: uppercase;
  font-weight: var(--cmc-w-medium); color: var(--cmc-ink-3);
  margin: 0 0 var(--cmc-sp-2);
}
.pr__bloco p { margin: 0; line-height: 1.6; }
.pr__lista, .pr__passos { margin: 0 0 var(--cmc-sp-4); padding: 0; list-style: none; }
.pr__lista li, .pr__passos li { line-height: 1.55; margin-bottom: var(--cmc-sp-2); }
.pr__lista li { padding-left: var(--cmc-sp-5); position: relative; }
.pr__lista li::before {
  content: ""; position: absolute; left: 0; top: 0.72em;
  width: var(--cmc-sp-4); height: 1px; background: currentColor; opacity: 0.4;
}
.pr__passos { counter-reset: pr; }
.pr__passos li { counter-increment: pr; padding-left: var(--cmc-sp-6); position: relative; }
.pr__passos li::before {
  content: counter(pr, decimal-leading-zero); position: absolute; left: 0;
  font-family: var(--cmc-font-mono); font-size: var(--cmc-fs-micro);
  font-variant-numeric: tabular-nums; color: var(--cmc-ink-3); top: 0.25em;
}
/* Barra do sabor: o acento identifica o programa, e não pinta o fundo. */
.pr__passos--prog li[style*="--prog"] { border-left: 3px solid var(--prog); padding-left: var(--cmc-sp-5); }
.pr__passos--prog li::before { content: none; }
.pr__rot[data-prog] { color: var(--prog); }
.pr__sec[style*="--prog"] { border-left: 3px solid var(--prog); padding-left: var(--cmc-sp-5); }

.pr__legado {
  margin: var(--cmc-sp-5) 0 0; padding-left: var(--cmc-sp-5);
  border-left: 2px solid var(--cmc-ink-3); line-height: 1.55;
}
/* Nota do assessment: interpretação, não achado. Marcada para ninguém
   confundir as duas — é uma exigência da regra editorial do documento. */
.pr__nota {
  margin: var(--cmc-sp-5) 0 0; padding: var(--cmc-sp-4);
  background: var(--cmc-paper); font-size: var(--cmc-fs-small); line-height: 1.55;
}

.pr__tabela { width: 100%; border-collapse: collapse; font-size: var(--cmc-fs-small); }
.pr__tabela th {
  text-align: left; font-weight: var(--cmc-w-medium); padding: var(--cmc-sp-3) 0;
  border-bottom: 1px solid var(--cmc-black);
}
.pr__tabela td { padding: var(--cmc-sp-3) 0; border-bottom: var(--cmc-border); vertical-align: top; }
