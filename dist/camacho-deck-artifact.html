<style>
/* ==========================================================================
   Camacho — Design Tokens
   Extraídos da exploração de identidade visual (moodboard, deck, pôster).
   Fonte única de verdade. Nada de valores soltos nos componentes.
   ========================================================================== */

:root {
  /* --- Cor ---------------------------------------------------------------
     A identidade é monocromática por convicção: preto puro, branco puro e
     uma escada de cinzas neutros. Sem cor de destaque — o destaque é o
     contraste e a densidade do dither. */
  --cmc-black:        #000000;   /* superfícies primárias, tinta */
  --cmc-ink:          #0A0A0A;   /* preto de tela, evita smear em OLED */
  --cmc-steel:        #3F3F3F;   /* painel escuro secundário (specimen tipográfico) */
  --cmc-grey-70:      #6E6E6E;
  --cmc-grey-55:      #8C8C8C;   /* numerais de processo, kickers */
  --cmc-grey-35:      #B5B5B5;
  --cmc-grey-20:      #D6D6D6;   /* réguas, bordas */
  --cmc-canvas:       #E4E4E4;   /* fundo de moodboard / plano de fundo institucional */
  --cmc-paper:        #F2F0EE;   /* papel do pôster, levemente quente */
  --cmc-white:        #FFFFFF;

  /* Papéis semânticos — use estes nos componentes */
  --cmc-bg:           var(--cmc-canvas);
  --cmc-surface:      var(--cmc-white);
  --cmc-surface-inv:  var(--cmc-black);
  --cmc-text:         var(--cmc-black);
  --cmc-text-muted:   var(--cmc-grey-55);
  --cmc-text-inv:     var(--cmc-white);
  --cmc-rule:         var(--cmc-grey-20);
  --cmc-particle:     var(--cmc-white);   /* dither sobre preto */
  --cmc-particle-inv: var(--cmc-black);   /* dither sobre claro */

  /* --- Tipografia --------------------------------------------------------
     Títulos em Light com tracking negativo: é o que dá o ar de engenharia
     calma que a marca precisa.
     Três vozes, um trabalho cada — e a regra que impede virar mingau:
     nunca competem no mesmo bloco.
       sistema   sustenta a marca e a interface, e amarra as outras duas
       editorial diagnóstico, artigo, material de formação — o lado humano
       medição   indicador, nível, rótulo de dado — o lado técnico */
  --cmc-font: "Inter Tight", "Inter", ui-sans-serif, system-ui,
              -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --cmc-font-serif: "Source Serif 4", ui-serif, Georgia, "Times New Roman", serif;
  --cmc-font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --cmc-w-light:  300;
  --cmc-w-book:   400;
  --cmc-w-medium: 500;

  /* Escala fluida (min → max entre 400px e 1600px) */
  --cmc-fs-display: clamp(3.5rem, 1.5rem + 8vw, 8rem);
  --cmc-fs-title:   clamp(2.25rem, 1.2rem + 4.2vw, 4.5rem);
  --cmc-fs-h1:      clamp(1.75rem, 1.1rem + 2.6vw, 3rem);
  --cmc-fs-h2:      clamp(1.375rem, 1rem + 1.5vw, 2rem);
  --cmc-fs-lead:    clamp(1.0625rem, 0.95rem + 0.6vw, 1.375rem);
  --cmc-fs-body:    1rem;
  --cmc-fs-small:   0.8125rem;
  --cmc-fs-micro:   0.6875rem;

  --cmc-lh-tight:   0.94;   /* display */
  --cmc-lh-snug:    1.08;   /* títulos */
  --cmc-lh-normal:  1.45;   /* texto corrido */

  --cmc-tr-display: -0.035em;
  --cmc-tr-title:   -0.025em;
  --cmc-tr-body:    -0.01em;
  --cmc-tr-micro:   0.02em;

  /* --- Espaçamento (base 4) --------------------------------------------- */
  --cmc-sp-1:  0.25rem;  --cmc-sp-2:  0.5rem;   --cmc-sp-3: 0.75rem;
  --cmc-sp-4:  1rem;     --cmc-sp-5:  1.5rem;   --cmc-sp-6: 2rem;
  --cmc-sp-7:  3rem;     --cmc-sp-8:  4rem;     --cmc-sp-9: 6rem;
  --cmc-sp-10: 8rem;

  --cmc-gutter: clamp(1.25rem, 3vw, 3rem);
  --cmc-measure: 62ch;          /* medida máxima de leitura */
  --cmc-max: 1440px;

  /* --- Forma -------------------------------------------------------------
     Raio grande e generoso, herdado do squircle da marca. */
  --cmc-r-mark:  22%;      /* proporcional ao lado — assinatura da marca */
  --cmc-r-card:  14px;
  --cmc-r-panel: 20px;
  --cmc-r-pill:  999px;

  --cmc-border: 1px solid var(--cmc-rule);

  /* Altura única de controle: é o que faz botão e tag alinharem lado a lado. */
  --cmc-control-h: 2.5rem;

  /* --- Elevação ----------------------------------------------------------
     Quase inexistente. A hierarquia vem de campo preto vs. campo claro. */
  --cmc-shadow-0: none;
  --cmc-shadow-1: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  --cmc-shadow-2: 0 2px 4px rgba(0,0,0,.08), 0 24px 60px rgba(0,0,0,.14);

  /* --- Níveis de maturidade ----------------------------------------------
     A marca é monocromática por argumento, não só por estética: num sistema
     que precisa comunicar NÍVEL (maturidade, prioridade, risco), o nível é
     codificado por densidade de partícula, não por matiz. Uma cor de destaque
     criaria um segundo sistema concorrendo com o motor gráfico.
     Estes valores alimentam `ramp` do dither e a opacidade de componentes. */
  --cmc-level-1: 0.10;   /* lacuna grande — quase nada instalado */
  --cmc-level-2: 0.30;
  --cmc-level-3: 0.52;
  --cmc-level-4: 0.76;
  --cmc-level-5: 1.00;   /* capacidade instalada e sustentada */

  /* --- Dither (o motor gráfico) ------------------------------------------
     Estes tokens governam o grafismo de partículas. */
  --cmc-cell: 4px;              /* aresta da célula da grade de partículas */
  --cmc-dither-min: 0.02;       /* densidade na ponta "ruído" */
  --cmc-dither-max: 1;          /* densidade na ponta "sinal" */
  --cmc-dither-jitter: 0.3;     /* deslocamento aleatório dentro da célula */

  /* --- Movimento ---------------------------------------------------------
     Uma curva só. Tudo resolve de ruído para forma. */
  --cmc-ease: cubic-bezier(.2,.7,.2,1);
  --cmc-dur-fast: 180ms;
  --cmc-dur-base: 420ms;
  --cmc-dur-slow: 900ms;
  --cmc-dur-resolve: 1600ms;    /* revelação do dither */

  --cmc-z-base: 0; --cmc-z-sticky: 100; --cmc-z-overlay: 500;
}

/* Campo escuro: inverte os papéis semânticos sem tocar na paleta. */
.cmc-inverse,
[data-cmc-field="dark"] {
  --cmc-bg:         var(--cmc-black);
  --cmc-surface:    var(--cmc-black);
  --cmc-text:       var(--cmc-white);
  --cmc-text-muted: var(--cmc-grey-55);
  --cmc-rule:       #2A2A2A;
  --cmc-particle:   var(--cmc-white);
}

</style>
<style>
/* ==========================================================================
   Camacho — Camada de componentes
   Depende de tokens/tokens.css. Nenhum valor mágico aqui.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cmc-bg);
  color: var(--cmc-text);
  font-family: var(--cmc-font);
  font-size: var(--cmc-fs-body);
  font-weight: var(--cmc-w-book);
  line-height: var(--cmc-lh-normal);
  letter-spacing: var(--cmc-tr-body);
  -webkit-font-smoothing: antialiased;
}

/* --- Tipografia ---------------------------------------------------------- */
.cmc-display, .cmc-title, .cmc-h1, .cmc-h2 {
  font-weight: var(--cmc-w-light);
  margin: 0;
  text-wrap: balance;
}
.cmc-display { font-size: var(--cmc-fs-display); line-height: var(--cmc-lh-tight); letter-spacing: var(--cmc-tr-display); }
.cmc-title   { font-size: var(--cmc-fs-title);   line-height: var(--cmc-lh-tight); letter-spacing: var(--cmc-tr-display); }
.cmc-h1      { font-size: var(--cmc-fs-h1);      line-height: var(--cmc-lh-snug);  letter-spacing: var(--cmc-tr-title); }
.cmc-h2      { font-size: var(--cmc-fs-h2);      line-height: var(--cmc-lh-snug);  letter-spacing: var(--cmc-tr-title); }
.cmc-lead    { font-size: var(--cmc-fs-lead);    line-height: 1.3; font-weight: var(--cmc-w-book); margin: 0; }
.cmc-body    { max-width: var(--cmc-measure); margin: 0; }
.cmc-body--justified { text-align: justify; hyphens: auto; }
/* Corpo do slide: empurrado para a base, para que slides vizinhos de alturas
   diferentes alinhem o rodapé. Justificado só quando a coluna é larga o
   bastante — abaixo disso o justificado abre rios e piora a leitura. */
.cmc-slide__body { margin: 0; margin-top: auto; }
@container (min-width: 26rem) {
  .cmc-slide__body { text-align: justify; hyphens: auto; }
}
.cmc-small   { font-size: var(--cmc-fs-small); color: var(--cmc-text-muted); }
.cmc-micro {
  font-size: var(--cmc-fs-micro);
  letter-spacing: var(--cmc-tr-micro);
  text-transform: uppercase;
  color: var(--cmc-text-muted);
  font-weight: var(--cmc-w-medium);
}
.cmc-muted { color: var(--cmc-text-muted); }

/* --- As três vozes -------------------------------------------------------
   Cada uma com um trabalho declarado. Elas se sucedem dentro de um bloco (o
   sistema abre, a editorial desenvolve), mas nunca disputam o mesmo papel:
   rótulo e número não vão em serifada, texto longo não vai em mono, e título
   de marca é sempre a voz de sistema. */
.cmc-editorial {
  font-family: var(--cmc-font-serif);
  font-size: var(--cmc-fs-lead);
  line-height: 1.6;
  letter-spacing: 0;
  max-width: var(--cmc-measure);
  margin: 0;
}
.cmc-editorial--lead { font-size: var(--cmc-fs-h2); line-height: 1.35; }
.cmc-measure {
  font-family: var(--cmc-font-mono);
  font-size: var(--cmc-fs-small);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}
.cmc-measure--big {
  font-size: var(--cmc-fs-h1);
  font-weight: var(--cmc-w-book);
  line-height: 1;
}

/* --- Marca ---------------------------------------------------------------
   O lockup é mark + wordmark com um espaço fixo proporcional à altura.
   Área de proteção = metade da altura da marca em todos os lados. */
.cmc-lockup {
  display: inline-flex;
  align-items: center;
  gap: 0.34em;
  font-size: var(--lockup-size, 2rem);
  line-height: 1;
  color: inherit;          /* herda o campo; nunca fixa preto sobre preto */
  text-decoration: none;
}
.cmc-lockup__mark { width: 1em; height: 1em; flex: none; display: block; }
/* O glifo sem o squircle ocupa menos da caixa, então compensa opticamente
   para pesar igual ao símbolo completo ao lado do wordmark. */
.cmc-lockup--glyph .cmc-lockup__mark { width: 1.14em; height: 1.14em; }
.cmc-lockup__word {
  font-size: 1em;
  font-weight: var(--cmc-w-medium);
  letter-spacing: -0.035em;
}
.cmc-lockup--sm { --lockup-size: 1.125rem; }
.cmc-lockup--lg { --lockup-size: clamp(2.5rem, 6vw, 5rem); }

/* --- Estrutura ----------------------------------------------------------- */
.cmc-shell { max-width: var(--cmc-max); margin-inline: auto; padding-inline: var(--cmc-gutter); }
.cmc-section { padding-block: var(--cmc-sp-9); }
.cmc-rule { border: 0; border-top: var(--cmc-border); margin: 0; }
.cmc-grid { display: grid; gap: var(--cmc-sp-5); }
.cmc-grid--2 { grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); }
.cmc-grid--3 { grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); }

/* Cabeçalho de seção: rótulo à esquerda, numeral à direita. */
.cmc-section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--cmc-sp-4); padding-bottom: var(--cmc-sp-3);
  border-bottom: var(--cmc-border); margin-bottom: var(--cmc-sp-6);
}

/* --- Slide de processo ---------------------------------------------------
   O componente-assinatura do deck: título + numeral, painel preto com o
   grafismo, linha de chamada, kicker à direita e corpo em cinza. */
.cmc-slide {
  background: var(--cmc-surface);
  border-radius: var(--cmc-r-card);
  padding: clamp(1.25rem, 2.4vw, 2rem);
  display: flex; flex-direction: column; gap: var(--cmc-sp-4);
  container-type: inline-size;
}
.cmc-slide__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--cmc-sp-4); }
/* Título e numeral escalam com a LARGURA DO CARD, não da viewport: é o que
   impede um título longo ("Transform") de encostar no numeral. */
.cmc-slide .cmc-title,
.cmc-slide .cmc-slide__num { font-size: clamp(1.5rem, 13cqi, 3.25rem); }
.cmc-slide .cmc-title { min-width: 0; overflow-wrap: break-word; }
.cmc-slide .cmc-slide__num { flex: none; }
.cmc-slide__num {
  font-size: var(--cmc-fs-title);
  font-weight: var(--cmc-w-light);
  letter-spacing: var(--cmc-tr-display);
  color: var(--cmc-grey-35);
  line-height: var(--cmc-lh-tight);
  font-variant-numeric: tabular-nums;
}
.cmc-slide__stage {
  background: var(--cmc-black);
  aspect-ratio: 16 / 6;
  width: 100%;
  color: var(--cmc-particle);   /* o canvas herda daqui */
  overflow: hidden;
}
.cmc-slide__stage canvas { display: block; width: 100%; height: 100%; }
.cmc-slide__caption { display: flex; align-items: baseline; justify-content: space-between; gap: var(--cmc-sp-4); }
@container (max-width: 420px) {
  .cmc-slide__caption { flex-direction: column; gap: var(--cmc-sp-1); }
}

/* --- Palco de grafismo genérico ------------------------------------------ */
.cmc-stage {
  position: relative;
  background: var(--cmc-black);
  color: var(--cmc-particle);
  border-radius: var(--cmc-r-panel);
  overflow: hidden;
  aspect-ratio: var(--stage-ar, 16 / 9);
}
.cmc-stage--light { background: var(--cmc-paper); color: var(--cmc-particle-inv); }
.cmc-stage--flat { border-radius: 0; }
.cmc-stage--bare { background: transparent; }
.cmc-stage canvas { display: block; width: 100%; height: 100%; }

/* --- Card ---------------------------------------------------------------- */
.cmc-card {
  background: var(--cmc-surface);
  border-radius: var(--cmc-r-card);
  padding: var(--cmc-sp-5);
  display: flex; flex-direction: column; gap: var(--cmc-sp-3);
}
.cmc-card--outline { background: transparent; border: var(--cmc-border); }

/* --- Botão ---------------------------------------------------------------
   Pílula. Sólida em preto, ou contorno. Sem gradiente, nunca. */
.cmc-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--cmc-sp-2);
  min-height: var(--cmc-control-h); padding: 0 1.35em;
  border-radius: var(--cmc-r-pill);
  border: 1px solid transparent;
  background: var(--cmc-black); color: var(--cmc-white);
  font: inherit; font-weight: var(--cmc-w-medium); font-size: var(--cmc-fs-small);
  letter-spacing: var(--cmc-tr-body);
  cursor: pointer; text-decoration: none;
  transition: transform var(--cmc-dur-fast) var(--cmc-ease),
              background-color var(--cmc-dur-fast) var(--cmc-ease),
              color var(--cmc-dur-fast) var(--cmc-ease);
}
.cmc-btn:hover { transform: translateY(-1px); }
.cmc-btn:active { transform: translateY(0); }
.cmc-btn:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
/* O contorno herda a cor do campo em que está: assim o mesmo botão funciona
   sobre branco e sobre preto sem variante extra. */
.cmc-btn--ghost {
  background: transparent; color: inherit;
  border-color: color-mix(in srgb, currentColor 32%, transparent);
}
.cmc-btn--ghost:hover { border-color: currentColor; }
.cmc-btn--inverse { background: var(--cmc-white); color: var(--cmc-black); }

/* --- Tag / pílula informativa -------------------------------------------- */
.cmc-tag {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--cmc-sp-2);
  min-height: var(--cmc-control-h); padding: 0 0.95em;
  border-radius: var(--cmc-r-pill);
  border: 1px solid currentColor;
  font-size: var(--cmc-fs-micro); letter-spacing: var(--cmc-tr-micro);
  text-transform: uppercase; font-weight: var(--cmc-w-medium);
  text-decoration: none; color: inherit;
}
a.cmc-tag:hover { background: currentColor; }
a.cmc-tag:hover > * { color: var(--cmc-bg); }

/* Fila de controles: botões e tags dividem a mesma altura e alinham. */
.cmc-controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cmc-sp-2); }
.cmc-controls--split { justify-content: space-between; }

/* --- Swatches ------------------------------------------------------------ */
.cmc-swatch { display: flex; flex-direction: column; gap: var(--cmc-sp-2); }
.cmc-swatch__chip {
  aspect-ratio: 3 / 2; border-radius: var(--cmc-r-card);
  border: var(--cmc-border); background: var(--chip);
}
.cmc-swatch__meta { display: flex; justify-content: space-between; gap: var(--cmc-sp-2); }

/* --- Pôster / peça de campanha ------------------------------------------- */
.cmc-poster {
  background: var(--cmc-paper); color: var(--cmc-black);
  aspect-ratio: 3 / 4; padding: clamp(1rem, 3cqi, 2.25rem);
  display: grid; grid-template-rows: auto 1fr auto; gap: var(--cmc-sp-4);
  container-type: inline-size; box-shadow: var(--cmc-shadow-2);
}
.cmc-poster__head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--cmc-sp-4); }
.cmc-poster__hed { text-align: right; font-size: clamp(1.5rem, 9cqi, 4rem); }
.cmc-poster__art { position: relative; color: var(--cmc-particle-inv); }
.cmc-poster__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cmc-poster__foot { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--cmc-sp-4); }

/* --- Do / Don't ---------------------------------------------------------- */
.cmc-rule-card { display: flex; flex-direction: column; gap: var(--cmc-sp-3); }
.cmc-rule-card__flag { font-weight: var(--cmc-w-medium); display: flex; align-items: center; gap: var(--cmc-sp-2); }
.cmc-rule-card--do .cmc-rule-card__flag::before { content: "＋"; }
.cmc-rule-card--dont .cmc-rule-card__flag::before { content: "−"; }
.cmc-rule-card--dont { color: var(--cmc-text-muted); }

/* --- Acessibilidade ------------------------------------------------------ */
:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

/* --- Key visual ----------------------------------------------------------
   Uma composição em três faixas — assinatura, grafismo, manchete — que vale
   para qualquer proporção. O grafismo ocupa a faixa do meio e cresce com o
   que sobra, e como todo campo do motor é ciente de proporção, a mesma peça
   se recompõe de 21:9 a 9:16 sem layout alternativo.

   Tudo escala a partir de UMA medida por formato (--kv-base), em cqi.

   Duas armadilhas de unidade, ambas encontradas na renderização:
   1. cqmin não serve — com container-type inline-size o eixo de bloco não é
      consultável e a unidade degenera.
   2. Um elemento NÃO pode usar as próprias unidades de container: em cqi
      declarado e usado no mesmo .cmc-kv, a medida resolve contra um ancestral
      (ou o viewport) e o padding estoura, esmagando a coluna. Por isso a
      grade mora num filho: lá dentro, cqi resolve contra o KV. */
.cmc-kv {
  --kv-base: 8cqi;
  position: relative;
  overflow: hidden;
  aspect-ratio: var(--kv-ar, 16 / 9);
  background: var(--kv-bg, var(--cmc-black));
  color: var(--kv-ink, var(--cmc-white));
  container-type: inline-size;
}
.cmc-kv__inner {
  position: absolute; inset: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: calc(var(--kv-base) * 0.42);
  padding: calc(var(--kv-base) * 0.62);
}
.cmc-kv__art { position: relative; min-height: 0; min-width: 0; }
.cmc-kv__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.cmc-kv__hed {
  margin: 0;
  font-size: var(--kv-base);
  line-height: 0.96;
  letter-spacing: -0.035em;
  font-weight: var(--cmc-w-light);
  text-wrap: balance;
}
/* O bloco de texto precisa de gap proporcional como o resto da peça: um
   `gap` em rem é absoluto e desaparece numa peça de 2560 px, ao mesmo tempo
   que domina uma miniatura. */
.cmc-kv__copy {
  display: flex; flex-direction: column;
  gap: calc(var(--kv-base) * 0.34);
}
.cmc-kv__pe {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: calc(var(--kv-base) * 0.5);
}
.cmc-kv__apoio {
  margin: 0; max-width: 42ch;
  font-size: calc(var(--kv-base) * 0.30); line-height: 1.35;
  color: color-mix(in srgb, currentColor 62%, transparent);
}
.cmc-kv__url {
  font-family: var(--cmc-font-mono);
  font-size: calc(var(--kv-base) * 0.25); flex: none;
}
.cmc-kv__lockup { --lockup-size: calc(var(--kv-base) * 0.58); }

</style>
<style>
/* ==========================================================================
   Camacho — Superfícies de produto
   --------------------------------------------------------------------------
   Componentes das PEÇAS (site, deck, proposta), não do guia. A separação
   importa: guide.css é andaime de documentação e pode ser jogado fora; isto
   aqui vai para o ar.
   ========================================================================== */

/* --- Navegação do site ---------------------------------------------------- */
.st-nav {
  position: sticky; top: 0; z-index: var(--cmc-z-sticky);
  background: color-mix(in srgb, var(--cmc-bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: var(--cmc-border);
}
.st-nav__inner {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--cmc-sp-5); padding-block: var(--cmc-sp-4);
}
.st-nav__links { display: flex; gap: var(--cmc-sp-5); align-items: center; }
.st-nav__links a {
  color: var(--cmc-text-muted); text-decoration: none;
  font-size: var(--cmc-fs-small);
}
.st-nav__links a:hover { color: var(--cmc-text); }
@media (max-width: 46rem) { .st-nav__links a:not(.cmc-btn) { display: none; } }

/* --- Hero ----------------------------------------------------------------- */
.st-hero { background: var(--cmc-black); color: var(--cmc-white); position: relative; overflow: hidden; }
.st-hero__art { position: absolute; inset: 0; opacity: 0.9; }
.st-hero__art canvas { width: 100%; height: 100%; display: block; }
.st-hero__inner {
  position: relative;
  display: flex; flex-direction: column; gap: var(--cmc-sp-6);
  padding-block: clamp(4rem, 14vh, 9rem);
  max-width: 46rem;
}
/* Uma cortina do fundo para o pé garante contraste do texto sobre a região
   densa das partículas — a regra do guia é não pôr manchete sobre ela. */
.st-hero::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(100deg, var(--cmc-black) 34%, transparent 78%);
}
.st-hero__inner { z-index: 1; }

/* --- Seções --------------------------------------------------------------- */
.st-sec { padding-block: clamp(3.5rem, 9vw, 7rem); }
.st-sec--claro { background: var(--cmc-white); }
.st-sec--escuro { background: var(--cmc-black); color: var(--cmc-white); }
.st-sec__head {
  display: flex; flex-direction: column; gap: var(--cmc-sp-4);
  max-width: 44rem; margin-bottom: var(--cmc-sp-7);
}

/* --- Cartões de conteúdo -------------------------------------------------- */
.st-cards { display: grid; gap: var(--cmc-sp-5); align-items: start;
            grid-template-columns: repeat(auto-fit, minmax(min(19rem, 100%), 1fr)); }
.st-card {
  display: flex; flex-direction: column; gap: var(--cmc-sp-3);
  padding: var(--cmc-sp-6); border: var(--cmc-border);
  border-radius: var(--cmc-r-card);
}
.st-card__num {
  font-family: var(--cmc-font-mono); font-size: var(--cmc-fs-small);
  color: var(--cmc-text-muted);
}
.st-card__art {
  position: relative; aspect-ratio: 16/6; background: var(--cmc-black);
  color: var(--cmc-particle); border-radius: 6px; overflow: hidden;
  margin-bottom: var(--cmc-sp-2);
}
.st-card__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* --- Lista de oferta ------------------------------------------------------ */
.st-oferta { display: grid; gap: var(--cmc-sp-6);
             grid-template-columns: repeat(auto-fit, minmax(min(22rem, 100%), 1fr)); }
.st-lista { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.st-lista li {
  padding-block: var(--cmc-sp-3); border-bottom: var(--cmc-border);
  font-size: var(--cmc-fs-small);
}
.st-lista li:last-child { border-bottom: 0; }

/* --- Chamada final -------------------------------------------------------- */
.st-cta {
  display: flex; flex-direction: column; gap: var(--cmc-sp-5);
  align-items: flex-start; max-width: 40rem;
}
.st-rodape { border-top: var(--cmc-border); padding-block: var(--cmc-sp-6); }
.st-rodape__inner {
  display: flex; flex-wrap: wrap; gap: var(--cmc-sp-5);
  justify-content: space-between; align-items: center;
}

/* ==========================================================================
   Deck — slides navegáveis
   ========================================================================== */
.dk { background: var(--cmc-black); color: var(--cmc-white); }
.dk__palco {
  position: relative; width: 100%; aspect-ratio: 16/9;
  container-type: inline-size; overflow: hidden;
}
.dk__slide {
  position: absolute; inset: 0;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 3cqi; padding: 6cqi;
  background: var(--slide-bg, var(--cmc-black));
  color: var(--slide-ink, var(--cmc-white));
  opacity: 0; visibility: hidden;
  transition: opacity var(--cmc-dur-base) var(--cmc-ease);
}
.dk__slide[data-ativo] { opacity: 1; visibility: visible; }
.dk__hed { font-size: 7cqi; line-height: 0.98; letter-spacing: -0.03em;
           font-weight: var(--cmc-w-light); margin: 0; text-wrap: balance; }
.dk__hed--grande { font-size: 11cqi; }
.dk__corpo { font-size: 2.6cqi; line-height: 1.5; margin: 0; max-width: 46ch; }
.dk__corpo--serif { font-family: var(--cmc-font-serif); font-size: 2.9cqi; }
.dk__art { position: relative; min-height: 0; }
.dk__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.dk__pe { display: flex; justify-content: space-between; align-items: flex-end;
          gap: 3cqi; font-family: var(--cmc-font-mono); font-size: 1.8cqi;
          color: color-mix(in srgb, currentColor 60%, transparent); }
.dk__lockup { --lockup-size: 4cqi; }
.dk__grade { display: grid; gap: 3cqi; grid-template-columns: repeat(var(--cols, 3), 1fr); align-content: center; }
.dk__item { display: flex; flex-direction: column; gap: 1cqi; }
.dk__item h4 { margin: 0; font-size: 3.4cqi; font-weight: var(--cmc-w-light); letter-spacing: -0.02em; }
.dk__item p { margin: 0; font-size: 2.1cqi; line-height: 1.45;
              color: color-mix(in srgb, currentColor 66%, transparent); }
.dk__barra {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--cmc-sp-4); padding-block: var(--cmc-sp-4);
}
.dk__conta { font-family: var(--cmc-font-mono); font-size: var(--cmc-fs-small);
             font-variant-numeric: tabular-nums; }

/* ==========================================================================
   Proposta — documento para ler e imprimir
   ========================================================================== */
.pr { max-width: 46rem; margin-inline: auto; }
.pr__capa {
  display: flex; flex-direction: column; gap: var(--cmc-sp-5);
  padding-block: var(--cmc-sp-8);
  border-bottom: 2px solid var(--cmc-black);
}
.pr__art { position: relative; aspect-ratio: 16/5; }
.pr__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pr__sec { padding-block: var(--cmc-sp-7); border-bottom: var(--cmc-border); }
.pr__rot {
  font-family: var(--cmc-font-mono); font-size: var(--cmc-fs-small);
  color: var(--cmc-text-muted); margin: 0 0 var(--cmc-sp-4);
}
.pr__tabela { width: 100%; border-collapse: collapse; font-size: var(--cmc-fs-small); }
.pr__tabela th {
  text-align: left; font-weight: var(--cmc-w-medium); padding: var(--cmc-sp-3) 0;
  border-bottom: 1px solid var(--cmc-black);
}
.pr__tabela td { padding: var(--cmc-sp-3) 0; border-bottom: var(--cmc-border); vertical-align: top; }
.pr__tabela td:last-child, .pr__tabela th:last-child {
  text-align: right; font-family: var(--cmc-font-mono); font-variant-numeric: tabular-nums;
}

@media print {
  @page { size: A4; margin: 18mm 16mm; }
  body { background: #fff; }
  .naoimprime { display: none !important; }
  .pr { max-width: none; }
  .pr__sec { break-inside: avoid; padding-block: 8mm; }
  .pr__capa { break-after: page; }
}

/* ==========================================================================
   Carrossel de LinkedIn — documento, não imagem
   A plataforma publica carrossel como PDF, então a peça é um documento de
   páginas 4:5 e o "export" é imprimir. Cada página é uma ideia.
   ========================================================================== */
.cr { max-width: 34rem; margin-inline: auto; display: flex; flex-direction: column; gap: var(--cmc-sp-5); }
.cr__pag {
  aspect-ratio: 4 / 5; container-type: inline-size; overflow: hidden;
  border-radius: var(--cmc-r-card);
  background: var(--pag-bg, var(--cmc-black)); color: var(--pag-ink, var(--cmc-white));
  position: relative;
}
.cr__inner {
  position: absolute; inset: 0; display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto; gap: 4cqi; padding: 7cqi;
}
.cr__hed { font-size: 9cqi; line-height: 0.98; letter-spacing: -0.03em;
           font-weight: var(--cmc-w-light); margin: 0; text-wrap: balance; }
.cr__corpo { font-size: 3.6cqi; line-height: 1.45; margin: 0;
             color: color-mix(in srgb, currentColor 68%, transparent); }
.cr__corpo--serif { font-family: var(--cmc-font-serif); font-size: 3.9cqi; }
.cr__art { position: relative; min-height: 0; }
.cr__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cr__pe { display: flex; justify-content: space-between; align-items: flex-end; gap: 4cqi;
          font-family: var(--cmc-font-mono); font-size: 2.6cqi;
          color: color-mix(in srgb, currentColor 60%, transparent); }
.cr__lockup { --lockup-size: 5.5cqi; }

@media print {
  @page { size: 1080px 1350px; margin: 0; }
  body { background: #fff; }
  .cr { max-width: none; gap: 0; display: block; }
  .cr__pag { width: 1080px; height: 1350px; aspect-ratio: auto;
             border-radius: 0; break-after: page; }
  .cr__pag:last-child { break-after: auto; }
}

/* Deck impresso: um slide por página, paisagem. É o caminho real de virar PDF. */
@media print {
  .dk__barra, .dk + p, body.dk > .cmc-shell > p { display: none; }
  .dk__palco { aspect-ratio: auto; }
  .dk__slide {
    position: relative; inset: auto; opacity: 1; visibility: visible;
    width: 1600px; height: 900px; break-after: page;
  }
  .dk__slide:last-child { break-after: auto; }
}

<style>
/* ==========================================================================
   Camacho — Design Tokens
   Extraídos da exploração de identidade visual (moodboard, deck, pôster).
   Fonte única de verdade. Nada de valores soltos nos componentes.
   ========================================================================== */

:root {
  /* --- Cor ---------------------------------------------------------------
     A identidade é monocromática por convicção: preto puro, branco puro e
     uma escada de cinzas neutros. Sem cor de destaque — o destaque é o
     contraste e a densidade do dither. */
  --cmc-black:        #000000;   /* superfícies primárias, tinta */
  --cmc-ink:          #0A0A0A;   /* preto de tela, evita smear em OLED */
  --cmc-steel:        #3F3F3F;   /* painel escuro secundário (specimen tipográfico) */
  --cmc-grey-70:      #6E6E6E;
  --cmc-grey-55:      #8C8C8C;   /* numerais de processo, kickers */
  --cmc-grey-35:      #B5B5B5;
  --cmc-grey-20:      #D6D6D6;   /* réguas, bordas */
  --cmc-canvas:       #E4E4E4;   /* fundo de moodboard / plano de fundo institucional */
  --cmc-paper:        #F2F0EE;   /* papel do pôster, levemente quente */
  --cmc-white:        #FFFFFF;

  /* Papéis semânticos — use estes nos componentes */
  --cmc-bg:           var(--cmc-canvas);
  --cmc-surface:      var(--cmc-white);
  --cmc-surface-inv:  var(--cmc-black);
  --cmc-text:         var(--cmc-black);
  --cmc-text-muted:   var(--cmc-grey-55);
  --cmc-text-inv:     var(--cmc-white);
  --cmc-rule:         var(--cmc-grey-20);
  --cmc-particle:     var(--cmc-white);   /* dither sobre preto */
  --cmc-particle-inv: var(--cmc-black);   /* dither sobre claro */

  /* --- Tipografia --------------------------------------------------------
     Títulos em Light com tracking negativo: é o que dá o ar de engenharia
     calma que a marca precisa.
     Três vozes, um trabalho cada — e a regra que impede virar mingau:
     nunca competem no mesmo bloco.
       sistema   sustenta a marca e a interface, e amarra as outras duas
       editorial diagnóstico, artigo, material de formação — o lado humano
       medição   indicador, nível, rótulo de dado — o lado técnico */
  --cmc-font: "Inter Tight", "Inter", ui-sans-serif, system-ui,
              -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --cmc-font-serif: "Source Serif 4", ui-serif, Georgia, "Times New Roman", serif;
  --cmc-font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --cmc-w-light:  300;
  --cmc-w-book:   400;
  --cmc-w-medium: 500;

  /* Escala fluida (min → max entre 400px e 1600px) */
  --cmc-fs-display: clamp(3.5rem, 1.5rem + 8vw, 8rem);
  --cmc-fs-title:   clamp(2.25rem, 1.2rem + 4.2vw, 4.5rem);
  --cmc-fs-h1:      clamp(1.75rem, 1.1rem + 2.6vw, 3rem);
  --cmc-fs-h2:      clamp(1.375rem, 1rem + 1.5vw, 2rem);
  --cmc-fs-lead:    clamp(1.0625rem, 0.95rem + 0.6vw, 1.375rem);
  --cmc-fs-body:    1rem;
  --cmc-fs-small:   0.8125rem;
  --cmc-fs-micro:   0.6875rem;

  --cmc-lh-tight:   0.94;   /* display */
  --cmc-lh-snug:    1.08;   /* títulos */
  --cmc-lh-normal:  1.45;   /* texto corrido */

  --cmc-tr-display: -0.035em;
  --cmc-tr-title:   -0.025em;
  --cmc-tr-body:    -0.01em;
  --cmc-tr-micro:   0.02em;

  /* --- Espaçamento (base 4) --------------------------------------------- */
  --cmc-sp-1:  0.25rem;  --cmc-sp-2:  0.5rem;   --cmc-sp-3: 0.75rem;
  --cmc-sp-4:  1rem;     --cmc-sp-5:  1.5rem;   --cmc-sp-6: 2rem;
  --cmc-sp-7:  3rem;     --cmc-sp-8:  4rem;     --cmc-sp-9: 6rem;
  --cmc-sp-10: 8rem;

  --cmc-gutter: clamp(1.25rem, 3vw, 3rem);
  --cmc-measure: 62ch;          /* medida máxima de leitura */
  --cmc-max: 1440px;

  /* --- Forma -------------------------------------------------------------
     Raio grande e generoso, herdado do squircle da marca. */
  --cmc-r-mark:  22%;      /* proporcional ao lado — assinatura da marca */
  --cmc-r-card:  14px;
  --cmc-r-panel: 20px;
  --cmc-r-pill:  999px;

  --cmc-border: 1px solid var(--cmc-rule);

  /* Altura única de controle: é o que faz botão e tag alinharem lado a lado. */
  --cmc-control-h: 2.5rem;

  /* --- Elevação ----------------------------------------------------------
     Quase inexistente. A hierarquia vem de campo preto vs. campo claro. */
  --cmc-shadow-0: none;
  --cmc-shadow-1: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  --cmc-shadow-2: 0 2px 4px rgba(0,0,0,.08), 0 24px 60px rgba(0,0,0,.14);

  /* --- Níveis de maturidade ----------------------------------------------
     A marca é monocromática por argumento, não só por estética: num sistema
     que precisa comunicar NÍVEL (maturidade, prioridade, risco), o nível é
     codificado por densidade de partícula, não por matiz. Uma cor de destaque
     criaria um segundo sistema concorrendo com o motor gráfico.
     Estes valores alimentam `ramp` do dither e a opacidade de componentes. */
  --cmc-level-1: 0.10;   /* lacuna grande — quase nada instalado */
  --cmc-level-2: 0.30;
  --cmc-level-3: 0.52;
  --cmc-level-4: 0.76;
  --cmc-level-5: 1.00;   /* capacidade instalada e sustentada */

  /* --- Dither (o motor gráfico) ------------------------------------------
     Estes tokens governam o grafismo de partículas. */
  --cmc-cell: 4px;              /* aresta da célula da grade de partículas */
  --cmc-dither-min: 0.02;       /* densidade na ponta "ruído" */
  --cmc-dither-max: 1;          /* densidade na ponta "sinal" */
  --cmc-dither-jitter: 0.3;     /* deslocamento aleatório dentro da célula */

  /* --- Movimento ---------------------------------------------------------
     Uma curva só. Tudo resolve de ruído para forma. */
  --cmc-ease: cubic-bezier(.2,.7,.2,1);
  --cmc-dur-fast: 180ms;
  --cmc-dur-base: 420ms;
  --cmc-dur-slow: 900ms;
  --cmc-dur-resolve: 1600ms;    /* revelação do dither */

  --cmc-z-base: 0; --cmc-z-sticky: 100; --cmc-z-overlay: 500;
}

/* Campo escuro: inverte os papéis semânticos sem tocar na paleta. */
.cmc-inverse,
[data-cmc-field="dark"] {
  --cmc-bg:         var(--cmc-black);
  --cmc-surface:    var(--cmc-black);
  --cmc-text:       var(--cmc-white);
  --cmc-text-muted: var(--cmc-grey-55);
  --cmc-rule:       #2A2A2A;
  --cmc-particle:   var(--cmc-white);
}

<style>
/* ==========================================================================
   Camacho — Camada de componentes
   Depende de tokens/tokens.css. Nenhum valor mágico aqui.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cmc-bg);
  color: var(--cmc-text);
  font-family: var(--cmc-font);
  font-size: var(--cmc-fs-body);
  font-weight: var(--cmc-w-book);
  line-height: var(--cmc-lh-normal);
  letter-spacing: var(--cmc-tr-body);
  -webkit-font-smoothing: antialiased;
}

/* --- Tipografia ---------------------------------------------------------- */
.cmc-display, .cmc-title, .cmc-h1, .cmc-h2 {
  font-weight: var(--cmc-w-light);
  margin: 0;
  text-wrap: balance;
}
.cmc-display { font-size: var(--cmc-fs-display); line-height: var(--cmc-lh-tight); letter-spacing: var(--cmc-tr-display); }
.cmc-title   { font-size: var(--cmc-fs-title);   line-height: var(--cmc-lh-tight); letter-spacing: var(--cmc-tr-display); }
.cmc-h1      { font-size: var(--cmc-fs-h1);      line-height: var(--cmc-lh-snug);  letter-spacing: var(--cmc-tr-title); }
.cmc-h2      { font-size: var(--cmc-fs-h2);      line-height: var(--cmc-lh-snug);  letter-spacing: var(--cmc-tr-title); }
.cmc-lead    { font-size: var(--cmc-fs-lead);    line-height: 1.3; font-weight: var(--cmc-w-book); margin: 0; }
.cmc-body    { max-width: var(--cmc-measure); margin: 0; }
.cmc-body--justified { text-align: justify; hyphens: auto; }
/* Corpo do slide: empurrado para a base, para que slides vizinhos de alturas
   diferentes alinhem o rodapé. Justificado só quando a coluna é larga o
   bastante — abaixo disso o justificado abre rios e piora a leitura. */
.cmc-slide__body { margin: 0; margin-top: auto; }
@container (min-width: 26rem) {
  .cmc-slide__body { text-align: justify; hyphens: auto; }
}
.cmc-small   { font-size: var(--cmc-fs-small); color: var(--cmc-text-muted); }
.cmc-micro {
  font-size: var(--cmc-fs-micro);
  letter-spacing: var(--cmc-tr-micro);
  text-transform: uppercase;
  color: var(--cmc-text-muted);
  font-weight: var(--cmc-w-medium);
}
.cmc-muted { color: var(--cmc-text-muted); }

/* --- As três vozes -------------------------------------------------------
   Cada uma com um trabalho declarado. Elas se sucedem dentro de um bloco (o
   sistema abre, a editorial desenvolve), mas nunca disputam o mesmo papel:
   rótulo e número não vão em serifada, texto longo não vai em mono, e título
   de marca é sempre a voz de sistema. */
.cmc-editorial {
  font-family: var(--cmc-font-serif);
  font-size: var(--cmc-fs-lead);
  line-height: 1.6;
  letter-spacing: 0;
  max-width: var(--cmc-measure);
  margin: 0;
}
.cmc-editorial--lead { font-size: var(--cmc-fs-h2); line-height: 1.35; }
.cmc-measure {
  font-family: var(--cmc-font-mono);
  font-size: var(--cmc-fs-small);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}
.cmc-measure--big {
  font-size: var(--cmc-fs-h1);
  font-weight: var(--cmc-w-book);
  line-height: 1;
}

/* --- Marca ---------------------------------------------------------------
   O lockup é mark + wordmark com um espaço fixo proporcional à altura.
   Área de proteção = metade da altura da marca em todos os lados. */
.cmc-lockup {
  display: inline-flex;
  align-items: center;
  gap: 0.34em;
  font-size: var(--lockup-size, 2rem);
  line-height: 1;
  color: inherit;          /* herda o campo; nunca fixa preto sobre preto */
  text-decoration: none;
}
.cmc-lockup__mark { width: 1em; height: 1em; flex: none; display: block; }
/* O glifo sem o squircle ocupa menos da caixa, então compensa opticamente
   para pesar igual ao símbolo completo ao lado do wordmark. */
.cmc-lockup--glyph .cmc-lockup__mark { width: 1.14em; height: 1.14em; }
.cmc-lockup__word {
  font-size: 1em;
  font-weight: var(--cmc-w-medium);
  letter-spacing: -0.035em;
}
.cmc-lockup--sm { --lockup-size: 1.125rem; }
.cmc-lockup--lg { --lockup-size: clamp(2.5rem, 6vw, 5rem); }

/* --- Estrutura ----------------------------------------------------------- */
.cmc-shell { max-width: var(--cmc-max); margin-inline: auto; padding-inline: var(--cmc-gutter); }
.cmc-section { padding-block: var(--cmc-sp-9); }
.cmc-rule { border: 0; border-top: var(--cmc-border); margin: 0; }
.cmc-grid { display: grid; gap: var(--cmc-sp-5); }
.cmc-grid--2 { grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); }
.cmc-grid--3 { grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); }

/* Cabeçalho de seção: rótulo à esquerda, numeral à direita. */
.cmc-section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--cmc-sp-4); padding-bottom: var(--cmc-sp-3);
  border-bottom: var(--cmc-border); margin-bottom: var(--cmc-sp-6);
}

/* --- Slide de processo ---------------------------------------------------
   O componente-assinatura do deck: título + numeral, painel preto com o
   grafismo, linha de chamada, kicker à direita e corpo em cinza. */
.cmc-slide {
  background: var(--cmc-surface);
  border-radius: var(--cmc-r-card);
  padding: clamp(1.25rem, 2.4vw, 2rem);
  display: flex; flex-direction: column; gap: var(--cmc-sp-4);
  container-type: inline-size;
}
.cmc-slide__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--cmc-sp-4); }
/* Título e numeral escalam com a LARGURA DO CARD, não da viewport: é o que
   impede um título longo ("Transform") de encostar no numeral. */
.cmc-slide .cmc-title,
.cmc-slide .cmc-slide__num { font-size: clamp(1.5rem, 13cqi, 3.25rem); }
.cmc-slide .cmc-title { min-width: 0; overflow-wrap: break-word; }
.cmc-slide .cmc-slide__num { flex: none; }
.cmc-slide__num {
  font-size: var(--cmc-fs-title);
  font-weight: var(--cmc-w-light);
  letter-spacing: var(--cmc-tr-display);
  color: var(--cmc-grey-35);
  line-height: var(--cmc-lh-tight);
  font-variant-numeric: tabular-nums;
}
.cmc-slide__stage {
  background: var(--cmc-black);
  aspect-ratio: 16 / 6;
  width: 100%;
  color: var(--cmc-particle);   /* o canvas herda daqui */
  overflow: hidden;
}
.cmc-slide__stage canvas { display: block; width: 100%; height: 100%; }
.cmc-slide__caption { display: flex; align-items: baseline; justify-content: space-between; gap: var(--cmc-sp-4); }
@container (max-width: 420px) {
  .cmc-slide__caption { flex-direction: column; gap: var(--cmc-sp-1); }
}

/* --- Palco de grafismo genérico ------------------------------------------ */
.cmc-stage {
  position: relative;
  background: var(--cmc-black);
  color: var(--cmc-particle);
  border-radius: var(--cmc-r-panel);
  overflow: hidden;
  aspect-ratio: var(--stage-ar, 16 / 9);
}
.cmc-stage--light { background: var(--cmc-paper); color: var(--cmc-particle-inv); }
.cmc-stage--flat { border-radius: 0; }
.cmc-stage--bare { background: transparent; }
.cmc-stage canvas { display: block; width: 100%; height: 100%; }

/* --- Card ---------------------------------------------------------------- */
.cmc-card {
  background: var(--cmc-surface);
  border-radius: var(--cmc-r-card);
  padding: var(--cmc-sp-5);
  display: flex; flex-direction: column; gap: var(--cmc-sp-3);
}
.cmc-card--outline { background: transparent; border: var(--cmc-border); }

/* --- Botão ---------------------------------------------------------------
   Pílula. Sólida em preto, ou contorno. Sem gradiente, nunca. */
.cmc-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--cmc-sp-2);
  min-height: var(--cmc-control-h); padding: 0 1.35em;
  border-radius: var(--cmc-r-pill);
  border: 1px solid transparent;
  background: var(--cmc-black); color: var(--cmc-white);
  font: inherit; font-weight: var(--cmc-w-medium); font-size: var(--cmc-fs-small);
  letter-spacing: var(--cmc-tr-body);
  cursor: pointer; text-decoration: none;
  transition: transform var(--cmc-dur-fast) var(--cmc-ease),
              background-color var(--cmc-dur-fast) var(--cmc-ease),
              color var(--cmc-dur-fast) var(--cmc-ease);
}
.cmc-btn:hover { transform: translateY(-1px); }
.cmc-btn:active { transform: translateY(0); }
.cmc-btn:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
/* O contorno herda a cor do campo em que está: assim o mesmo botão funciona
   sobre branco e sobre preto sem variante extra. */
.cmc-btn--ghost {
  background: transparent; color: inherit;
  border-color: color-mix(in srgb, currentColor 32%, transparent);
}
.cmc-btn--ghost:hover { border-color: currentColor; }
.cmc-btn--inverse { background: var(--cmc-white); color: var(--cmc-black); }

/* --- Tag / pílula informativa -------------------------------------------- */
.cmc-tag {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--cmc-sp-2);
  min-height: var(--cmc-control-h); padding: 0 0.95em;
  border-radius: var(--cmc-r-pill);
  border: 1px solid currentColor;
  font-size: var(--cmc-fs-micro); letter-spacing: var(--cmc-tr-micro);
  text-transform: uppercase; font-weight: var(--cmc-w-medium);
  text-decoration: none; color: inherit;
}
a.cmc-tag:hover { background: currentColor; }
a.cmc-tag:hover > * { color: var(--cmc-bg); }

/* Fila de controles: botões e tags dividem a mesma altura e alinham. */
.cmc-controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cmc-sp-2); }
.cmc-controls--split { justify-content: space-between; }

/* --- Swatches ------------------------------------------------------------ */
.cmc-swatch { display: flex; flex-direction: column; gap: var(--cmc-sp-2); }
.cmc-swatch__chip {
  aspect-ratio: 3 / 2; border-radius: var(--cmc-r-card);
  border: var(--cmc-border); background: var(--chip);
}
.cmc-swatch__meta { display: flex; justify-content: space-between; gap: var(--cmc-sp-2); }

/* --- Pôster / peça de campanha ------------------------------------------- */
.cmc-poster {
  background: var(--cmc-paper); color: var(--cmc-black);
  aspect-ratio: 3 / 4; padding: clamp(1rem, 3cqi, 2.25rem);
  display: grid; grid-template-rows: auto 1fr auto; gap: var(--cmc-sp-4);
  container-type: inline-size; box-shadow: var(--cmc-shadow-2);
}
.cmc-poster__head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--cmc-sp-4); }
.cmc-poster__hed { text-align: right; font-size: clamp(1.5rem, 9cqi, 4rem); }
.cmc-poster__art { position: relative; color: var(--cmc-particle-inv); }
.cmc-poster__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cmc-poster__foot { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--cmc-sp-4); }

/* --- Do / Don't ---------------------------------------------------------- */
.cmc-rule-card { display: flex; flex-direction: column; gap: var(--cmc-sp-3); }
.cmc-rule-card__flag { font-weight: var(--cmc-w-medium); display: flex; align-items: center; gap: var(--cmc-sp-2); }
.cmc-rule-card--do .cmc-rule-card__flag::before { content: "＋"; }
.cmc-rule-card--dont .cmc-rule-card__flag::before { content: "−"; }
.cmc-rule-card--dont { color: var(--cmc-text-muted); }

/* --- Acessibilidade ------------------------------------------------------ */
:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

/* --- Key visual ----------------------------------------------------------
   Uma composição em três faixas — assinatura, grafismo, manchete — que vale
   para qualquer proporção. O grafismo ocupa a faixa do meio e cresce com o
   que sobra, e como todo campo do motor é ciente de proporção, a mesma peça
   se recompõe de 21:9 a 9:16 sem layout alternativo.

   Tudo escala a partir de UMA medida por formato (--kv-base), em cqi.

   Duas armadilhas de unidade, ambas encontradas na renderização:
   1. cqmin não serve — com container-type inline-size o eixo de bloco não é
      consultável e a unidade degenera.
   2. Um elemento NÃO pode usar as próprias unidades de container: em cqi
      declarado e usado no mesmo .cmc-kv, a medida resolve contra um ancestral
      (ou o viewport) e o padding estoura, esmagando a coluna. Por isso a
      grade mora num filho: lá dentro, cqi resolve contra o KV. */
.cmc-kv {
  --kv-base: 8cqi;
  position: relative;
  overflow: hidden;
  aspect-ratio: var(--kv-ar, 16 / 9);
  background: var(--kv-bg, var(--cmc-black));
  color: var(--kv-ink, var(--cmc-white));
  container-type: inline-size;
}
.cmc-kv__inner {
  position: absolute; inset: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: calc(var(--kv-base) * 0.42);
  padding: calc(var(--kv-base) * 0.62);
}
.cmc-kv__art { position: relative; min-height: 0; min-width: 0; }
.cmc-kv__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.cmc-kv__hed {
  margin: 0;
  font-size: var(--kv-base);
  line-height: 0.96;
  letter-spacing: -0.035em;
  font-weight: var(--cmc-w-light);
  text-wrap: balance;
}
/* O bloco de texto precisa de gap proporcional como o resto da peça: um
   `gap` em rem é absoluto e desaparece numa peça de 2560 px, ao mesmo tempo
   que domina uma miniatura. */
.cmc-kv__copy {
  display: flex; flex-direction: column;
  gap: calc(var(--kv-base) * 0.34);
}
.cmc-kv__pe {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: calc(var(--kv-base) * 0.5);
}
.cmc-kv__apoio {
  margin: 0; max-width: 42ch;
  font-size: calc(var(--kv-base) * 0.30); line-height: 1.35;
  color: color-mix(in srgb, currentColor 62%, transparent);
}
.cmc-kv__url {
  font-family: var(--cmc-font-mono);
  font-size: calc(var(--kv-base) * 0.25); flex: none;
}
.cmc-kv__lockup { --lockup-size: calc(var(--kv-base) * 0.58); }

</style>

<script type="module">
/* ==========================================================================
   Camacho — Dither Engine
   --------------------------------------------------------------------------
   Todo grafismo da marca é a mesma ideia: uma FORMA amostrada por uma GRADE
   de partículas quadradas, cuja probabilidade de existir varia ao longo de
   uma RAMPA. Ruído de um lado, sinal do outro. É a tese da empresa desenhada.

   Uso declarativo:
     <canvas data-cmc-dither="ring" data-ramp="0.02,1" data-angle="0"></canvas>

   Uso programático:
     import { render, fields } from './dither.js'
     render(canvas, { shape: 'chevrons', ramp: [0.05, 1], angle: 180 })
   ========================================================================== */

/* --- PRNG determinístico -------------------------------------------------
   Hash por célula (não sequencial): a mesma célula devolve sempre o mesmo
   número, então redimensionar ou animar não faz o grafismo "ferver". */
function hash(x, y, seed) {
  let h = x * 374761393 + y * 668265263 + seed * 1274126177;
  h = (h ^ (h >>> 13)) >>> 0;
  h = Math.imul(h, 1274126177) >>> 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

/* --- Matriz de Bayer 8×8 -------------------------------------------------
   Limiar ordenado, gerado por recursão em vez de tabelado: a mesma célula
   sempre cai no mesmo degrau, o que produz trama regular de impressão em
   lugar do grão aleatório. */
const BAYER = (() => {
  let m = [[0]];
  while (m.length < 8) {
    const n = m.length, out = [];
    for (let y = 0; y < n * 2; y++) out.push(new Array(n * 2));
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const q = m[y][x] * 4;
      out[y][x] = q; out[y][x + n] = q + 2;
      out[y + n][x] = q + 3; out[y + n][x + n] = q + 1;
    }
    m = out;
  }
  return m.map((row) => row.map((v) => (v + 0.5) / 64));
})();
/* Borda macia: converte distância assinada em cobertura 0..1 */
const edge = (d, soft) => clamp01(0.5 - d / (soft || 0.012));

/* --- Campos de forma -----------------------------------------------------
   Cada campo é f(u, v) -> cobertura 0..1, em espaço normalizado onde
   u ∈ [0,1] e v é corrigido pela proporção (v ∈ [0, h/w]). */
const fields = {
  /* `k` = meia-altura do campo: deixa toda forma se ajustar à proporção do
     canvas sem que ninguém precise recalcular raios na mão. */

  /* Sinal: o disco cheio. Massa resolvida. */
  disc: ({ r = 0.82, soft = 0.02 } = {}) => (u, v, ar) => {
    const k = Math.min(0.5, ar / 2);
    return edge(Math.hypot(u - 0.5, v - ar / 2) - k * r, soft);
  },

  /* Ruído: o anel. Mesma forma, sem miolo. */
  ring: ({ r = 0.82, w = 0.26, soft = 0.02 } = {}) => (u, v, ar) => {
    const k = Math.min(0.5, ar / 2);
    return edge(Math.abs(Math.hypot(u - 0.5, v - ar / 2) - k * r) - (k * w) / 2, soft);
  },

  /* Deploy: cadência de setas. Velocidade como repetição. */
  chevrons: ({ n = 3, gap = 0.02, inset = 0.03, soft = 0.012 } = {}) => (u, v, ar) => {
    /* `inset` mantém a ponta da última seta dentro do quadro, sem parecer cortada */
    const usable = 1 - inset * 2;
    const span = (usable - gap * (n - 1)) / n;
    for (let i = 0; i < n; i++) {
      const t = (u - inset - i * (span + gap)) / span;
      if (t < 0 || t > 1) continue;
      const half = (1 - t) * ar * 0.46;          /* triângulo apontando à direita */
      return edge(Math.abs(v - ar / 2) - half, soft);
    }
    return 0;
  },

  /* Transform: matriz de blocos. Padrão bruto virando estrutura. */
  bars: ({ cols = 20, rows = 5, duty = 0.5 } = {}) => (u, v, ar) => {
    if ((u * cols) % 1 > duty) return 0;
    const col = Math.floor(u * cols);
    const rv = (v / ar) * rows;
    const row = Math.floor(rv);
    if (row < 0 || row >= rows) return 0;
    /* algumas colunas viram barras inteiras: é o que dá o ritmo do print */
    const full = hash(col, 0, 91) > 0.78;
    if (full) return 1;
    return (rv % 1) < 0.62 && hash(col, row, 17) > 0.22 ? 1 : 0;
  },

  /* Refine: o laço. Círculo com caudas que entram e saem. */
  loop: ({ r = 0.62, w = 0.2, soft = 0.014 } = {}) => (u, v, ar) => {
    const k = Math.min(0.5, ar / 2), R = k * r, W = k * w;
    const cy = ar / 2;
    const ringD = Math.abs(Math.hypot(u - 0.5, v - cy) - R) - W / 2;
    const tailD = Math.abs(v - cy) - W / 2;
    const inTail = u < 0.5 - R * 0.5 || u > 0.5 + R * 0.5;
    return edge(inTail ? Math.min(ringD, tailD) : ringD, soft);
  },

  /* Camadas: losangos isométricos empilhados. Infraestrutura. */
  layers: ({ n = 3, rx = 0.24, soft = 0.014 } = {}) => (u, v, ar) => {
    const ry = ar * 0.15, gap = ar * 0.33;
    const base = ar / 2 - ((n - 1) * gap) / 2;
    for (let i = 0; i < n; i++) {
      const d = Math.abs(u - 0.5) / rx + Math.abs(v - (base + i * gap)) / ry - 1;
      if (d < 0) return edge(d * ry, soft);
    }
    return 0;
  },

  /* A marca: o "C" dele mesmo, dissolvido. Camiseta, capa, hero. */
  mark: ({ r = 0.78, w = 0.3, aperture = 0.36, soft = 0.016 } = {}) => (u, v, ar) => {
    const k = Math.min(0.5, ar / 2), R = k * r, W = k * w, cy = ar / 2;
    if (u > 0.5 && Math.abs(v - cy) < R * aperture) return 0;   /* abertura do C */
    return edge(Math.abs(Math.hypot(u - 0.5, v - cy) - R) - W / 2, soft);
  },

  /* --- Tipografia dissolvida ---------------------------------------------
     Rasteriza o texto num canvas fora da tela e usa o alpha como cobertura.
     Com isso qualquer palavra vira grafismo da marca: manchete de pôster,
     post de social, capa de relatório. A máscara é construída na primeira
     chamada, quando a proporção já é conhecida, e reaproveitada depois. */
  text: ({ text = 'Camacho', weight = 300, tracking = '-0.04em', fit = 0.92,
           lineHeight = 0.98 } = {}) => {
    let mask = null, mw = 0, mh = 0, builtFor = -1;

    const build = (ar) => {
      const W = 900, H = Math.max(1, Math.round(W * ar));
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const x = c.getContext('2d', { willReadFrequently: true });
      const rows = String(text).split('\n');
      const setFont = (px) => {
        x.font = `${weight} ${px}px "Inter Tight", "Inter", sans-serif`;
        if ('letterSpacing' in x) x.letterSpacing = `${px * parseFloat(tracking)}px`;
      };
      x.textAlign = 'left'; x.textBaseline = 'middle'; x.fillStyle = '#fff';

      /* O Chromium soma o espaçamento também DEPOIS do último glifo, então
         measureText devolve mais (ou menos, com tracking negativo) do que a
         mancha real. Descontar isso é o que mantém a linha centrada. */
      const lineWidth = (r, px) => x.measureText(r).width - px * parseFloat(tracking);

      /* Ajusta o corpo até caber na caixa, na altura e na largura. */
      let px = (H / rows.length) * 0.95;
      setFont(px);
      const widest = Math.max(...rows.map((r) => lineWidth(r, px))) || 1;
      if (widest > W * fit) { px *= (W * fit) / widest; setFont(px); }

      const lh = px * lineHeight, total = lh * rows.length;
      rows.forEach((r, i) => x.fillText(
        r,
        (W - lineWidth(r, px)) / 2,
        H / 2 - total / 2 + lh * (i + 0.5),
      ));

      const data = x.getImageData(0, 0, W, H).data;
      mask = new Uint8Array(W * H);
      for (let k = 0; k < mask.length; k++) mask[k] = data[k * 4 + 3];
      mw = W; mh = H; builtFor = ar;
    };

    return (u, v, ar) => {
      if (builtFor !== ar) build(ar);
      const x = (u * mw) | 0, y = ((v / ar) * mh) | 0;
      if (x < 0 || x >= mw || y < 0 || y >= mh) return 0;
      return mask[y * mw + x] / 255;
    };
  },

  /* --- Vocabulário estendido --------------------------------------------
     Cada forma carrega uma ideia do negócio; nenhuma é ornamento. */

  /* Prioritize: muitos entram, poucos saem. O funil. */
  funnel: ({ mouth = 0.9, throat = 0.16, soft = 0.014 } = {}) => (u, v, ar) => {
    const t = clamp01(u);
    const half = (ar / 2) * (mouth - (mouth - throat) * Math.pow(t, 0.7));
    return edge(Math.abs(v - ar / 2) - half, soft);
  },

  /* O sinal literal: onda que sai de plana e ganha amplitude. */
  wave: ({ cycles = 3, amp = 0.3, w = 0.1, soft = 0.014 } = {}) =>
    (u, v, ar) => {
      /* ciclos inteiros: a onda fecha na linha de centro em vez de parecer
         cortada pela borda */
      const swell = Math.pow(u, 1.4);
      const y = ar / 2 + Math.sin(u * cycles * Math.PI * 2) * ar * amp * swell;
      return edge(Math.abs(v - y) - (ar * w) / 2, soft);
    },

  /* Agentes em volta do seu stack: um núcleo e nós em órbita. */
  orbit: ({ nodes = 7, core = 0.22, node = 0.11, ringW = 0.03, soft = 0.012 } = {}) =>
    (u, v, ar) => {
      const k = Math.min(0.5, ar / 2), cy = ar / 2;
      const dist = Math.hypot(u - 0.5, v - cy);
      let cov = edge(dist - k * core, soft);                 /* núcleo */
      cov = Math.max(cov, edge(Math.abs(dist - k * 0.82) - k * ringW, soft)); /* trilha */
      for (let i = 0; i < nodes; i++) {
        const a = (i / nodes) * Math.PI * 2;
        const nx = 0.5 + Math.cos(a) * k * 0.82;
        const ny = cy + Math.sin(a) * k * 0.82;
        cov = Math.max(cov, edge(Math.hypot(u - nx, v - ny) - k * node, soft));
      }
      return cov;
    },

  /* Ganhos que compõem: a escada. */
  staircase: ({ steps = 5, soft = 0.01 } = {}) => (u, v, ar) => {
    const i = Math.min(steps - 1, Math.floor(u * steps));
    const top = ar - ar * ((i + 1) / steps);
    return v >= top ? edge(-0.02, soft) : 0;
  },

  /* Malha de nós conectados: a rede que o sistema vira. */
  mesh: ({ cols = 7, rows = 4, node = 0.028, link = 0.004, pad = 0.07, soft = 0.008 } = {}) =>
    (u, v, ar) => {
      /* `pad` afasta a grade das bordas: nó cortado pela metade lê como defeito */
      const x0 = pad, y0 = ar * pad;
      const gx = (1 - pad * 2) / (cols - 1), gy = (ar - y0 * 2) / (rows - 1);
      const cx = Math.round((u - x0) / gx), cy = Math.round((v - y0) / gy);
      let cov = 0;
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const i = cx + dx, j = cy + dy;
        if (i < 0 || i >= cols || j < 0 || j >= rows) continue;
        const px = x0 + i * gx, py = y0 + j * gy;
        cov = Math.max(cov, edge(Math.hypot(u - px, v - py) - node, soft));
        /* liga ao vizinho da direita e ao de baixo */
        if (i + 1 < cols && u >= px && u <= px + gx)
          cov = Math.max(cov, edge(Math.abs(v - py) - link, soft));
        if (j + 1 < rows && v >= py && v <= py + gy)
          cov = Math.max(cov, edge(Math.abs(u - px) - link, soft));
      }
      return cov;
    },

  /* Espiral: o ciclo que não volta ao mesmo ponto. */
  spiral: ({ turns = 2.6, w = 0.05, soft = 0.012 } = {}) => (u, v, ar) => {
    const k = Math.min(0.5, ar / 2), cy = ar / 2;
    const dx = u - 0.5, dy = v - cy;
    const dist = Math.hypot(dx, dy) / k;
    if (dist > 1) return 0;
    const a = (Math.atan2(dy, dx) + Math.PI * 2) % (Math.PI * 2);
    /* distância à volta mais próxima da espiral de Arquimedes */
    const target = dist * turns * Math.PI * 2;
    const delta = ((target - a) / (Math.PI * 2)) % 1;
    const d = Math.min(delta, 1 - delta) / turns;
    return edge(d - w / 2, soft);
  },

  /* Área cheia: cobertura 1 em todo o quadro. Sozinho não desenha nada — o
     que ele faz é entregar a superfície inteira para a rampa, de modo que a
     DENSIDADE vire o conteúdo. É como uma barra de nível é desenhada. */
  fill: () => () => 1,

  /* --- Vocabulário da transformação -------------------------------------
     A costura, a incorporação, a medida e a transferência: as quatro ideias
     que o vocabulário anterior (todo sobre matéria e sistema) não dizia. */

  /* A COSTURA — o grafismo-âncora. Dois fios entram separados, com fases
     opostas, e se entrelaçam até virar um só. É a tese da marca: técnico e
     humano não correm em paralelo, eles se costuram. */
  weave: ({ cycles = 2.5, amp = 0.42, w = 0.09, inset = 0.04, soft = 0.014 } = {}) =>
    (u0, v, ar) => {
      /* `inset` mantém a ponta costurada dentro do quadro: fio encostando na
         borda lê como corte, não como conclusão. */
      const u = (u0 - inset) / (1 - inset * 2);
      if (u < 0 || u > 1) return 0;
      const cy = ar / 2;
      /* A amplitude decai até zero: no fim do percurso os dois fios ocupam
         a mesma linha, que é o que faz "dois viram um" e não "dois lado a lado". */
      const abertura = Math.pow(1 - u, 1.6) * ar * amp;
      const fase = u * cycles * Math.PI * 2;
      const fioA = cy + Math.sin(fase) * abertura;
      const fioB = cy - Math.sin(fase) * abertura;
      const meia = (ar * w) / 2;
      return Math.max(
        edge(Math.abs(v - fioA) - meia, soft),
        edge(Math.abs(v - fioB) - meia, soft),
      );
    },

  /* INCORPORAR — pessoas entrando em sintonia. Marcas dispersas à esquerda
     que se alinham numa linha à direita. O desalinhamento é função de x, não
     do tempo: o mesmo grafismo sempre, sem animação por trás. */
  cohort: ({ n = 9, r = 0.62, inset = 0.04, soft = 0.012 } = {}) => (u, v, ar) => {
    const cy = ar / 2, util = 1 - inset * 2, passo = util / n;
    /* O raio precisa respeitar os dois eixos: só horizontal estoura em 1:1,
       só vertical some em faixa larga e baixa como o palco do slide (16:6). */
    const R = Math.min(passo * r, ar * 0.16);
    let cov = 0;
    const col = Math.round((u - inset) / passo);
    for (let d = -1; d <= 1; d++) {
      const i = col + d;
      if (i < 0 || i >= n) continue;
      const cx = inset + (i + 0.5) * passo;
      const t = (cx - inset) / util;
      /* dispersão que se fecha conforme avança */
      const solta = (hash(i, 0, 41) - 0.5) * 2;
      const y = cy + solta * (ar / 2 - R) * 0.9 * Math.pow(1 - t, 1.7);
      cov = Math.max(cov, edge(Math.hypot(u - cx, v - y) - R, soft));
    }
    return cov;
  },

  /* MEDIR — a marca virando instrumento. O mesmo "C" repetido com a abertura
     fechando: uma escala de maturidade. Aberto = lacuna grande; quase fechado
     = capacidade instalada. */
  gauge: ({ n = 5, w = 0.34, de = 0.62, ate = 0.06, inset = 0.05, soft = 0.014 } = {}) =>
    (u, v, ar) => {
      /* A escala corre no eixo LONGO do quadro. Numa peça alta, uma fileira
         horizontal ocuparia uma faixa fina e ficaria boiando — a forma saber a
         proporção em que está é o mesmo princípio de todo o motor. */
      const empilha = ar > 1.15;
      const [eixo, cruz, extEixo, extCruz] = empilha ? [v, u, ar, 1] : [u, v, 1, ar];
      const util = extEixo - inset * 2 * extEixo, passo = util / n;
      const ini = inset * extEixo;
      if (eixo < ini || eixo > extEixo - ini) return 0;
      const i = Math.min(n - 1, Math.floor((eixo - ini) / passo));
      const cEixo = ini + (i + 0.5) * passo, cCruz = extCruz / 2;
      const R = Math.min(passo * 0.38, extCruz * 0.36);
      const W = R * w * 2;
      const t = n === 1 ? 0 : i / (n - 1);
      const abertura = de + (ate - de) * t;      /* fecha ao longo da escala */
      const dEixo = eixo - cEixo, dCruz = cruz - cCruz;
      /* o vão do C aponta para o fim da escala */
      if (dEixo > 0 && Math.abs(dCruz) < R * abertura) return 0;
      return edge(Math.abs(Math.hypot(dEixo, dCruz) - R) - W / 2, soft);
    },

  /* TRANSFERIR — a capacidade mudando de mãos. Um recipiente que esvazia à
     esquerda, um que enche à direita, e o fluxo entre eles. O diferencial
     declarado: o objetivo não é criar dependência permanente. */
  handoff: ({ r = 0.6, w = 0.22, canal = 0.05, vao = 0.58, soft = 0.014 } = {}) =>
    (u, v, ar) => {
      /* A transferência também corre no eixo longo: em peça alta, de cima
         para baixo. */
      const empilha = ar > 1.15;
      const [eixo, cruz, extEixo, extCruz] = empilha ? [v, u, ar, 1] : [u, v, 1, ar];
      const cy = extCruz / 2;
      const xEsq = extEixo * (1 - vao) / 2, xDir = extEixo - xEsq;
      /* o raio precisa caber no eixo curto E na folga entre os dois centros,
         senão em 1:1 os recipientes se atravessam */
      const R = Math.min(extCruz * 0.42, ((xDir - xEsq) / 2) * r);
      const dEsq = Math.hypot(eixo - xEsq, cruz - cy);
      const dDir = Math.hypot(eixo - xDir, cruz - cy);
      /* esquerda: só o contorno (esvaziou) · direita: massa cheia (recebeu) */
      const esq = edge(Math.abs(dEsq - R) - (R * w) / 2, soft);
      const dir = edge(dDir - R, soft);
      /* o canal só existe entre os dois */
      const canalCov = eixo > xEsq && eixo < xDir
        ? edge(Math.abs(cruz - cy) - extCruz * canal, soft) : 0;
      return Math.max(esq, Math.max(dir, canalCov));
    },

  /* Grafismo-âncora: anel de ruído + disco de sinal, lado a lado. */
  noiseToSignal: ({ soft = 0.02 } = {}) => (u, v, ar) => {
    const cy = ar / 2, R = Math.min(0.21, ar * 0.4);
    const a = Math.abs(Math.hypot(u - 0.3, v - cy) - R) - R * 0.28;
    const b = Math.hypot(u - 0.7, v - cy) - R;
    return Math.max(edge(a, soft), edge(b, soft));
  },
};

/* --- Rampa de densidade --------------------------------------------------
   Projeta cada ponto num eixo girado e interpola de `from` a `to`.
   angle 0 = ruído à esquerda; 180 = ruído à direita; 90 = de baixo. */
function axis(u, v, ar, angle) {
  const rad = (angle * Math.PI) / 180;
  const cos = Math.cos(rad), sin = Math.sin(rad);
  const proj = (u - 0.5) * cos + (v - ar / 2) * sin;
  const half = (Math.abs(cos) + Math.abs(sin) * ar) / 2;   /* extensão real do eixo */
  return clamp01(proj / (2 * half) + 0.5);
}

/* Posição na rampa, 0 na ponta "ruído" e 1 na ponta "sinal". */
function rampPos(u, v, ar, { angle, mirror, radial }) {
  if (radial) {
    /* denso no miolo, dispersando para fora — para peças centradas */
    const d = Math.hypot(u - 0.5, v - ar / 2) / Math.hypot(0.5, ar / 2);
    return clamp01(1 - d);
  }
  const t = axis(u, v, ar, angle);
  /* mirror: pico no centro do eixo, dispersando para os dois lados */
  return mirror ? 1 - Math.abs(t * 2 - 1) : t;
}

function rampAt(u, v, ar, cfg) {
  return cfg.from + (cfg.to - cfg.from) * Math.pow(rampPos(u, v, ar, cfg), cfg.curve);
}

const DEFAULTS = {
  shape: 'disc',
  cell: 4,           /* px lógicos por célula */
  ramp: [0.03, 1],   /* densidade [ruído, sinal] */
  angle: 0,
  curve: 1.35,       /* > 1 mantém a dispersão por mais tempo */
  seed: 7,
  jitter: 0.3,       /* deslocamento dentro da célula */
  color: null,       /* null = herda currentColor do canvas */
  background: null,  /* preenche o fundo antes de desenhar (útil ao exportar) */
  width: null,       /* força a largura em px lógicos, ignorando o layout */
  height: null,      /* idem para a altura — é o que permite exportar grande */
  scale: true,       /* partícula cresce com a densidade local */
  mirror: false,     /* rampa espelhada: denso no centro, disperso nas pontas */
  radial: false,     /* rampa radial: denso no miolo, disperso nas bordas */
  texture: 'grain',  /* grain (estocástica) | screen (Bayer) | halftone (ponto variável) */
  progress: 1,       /* 0..1 para animar a resolução */
  opts: null,        /* parâmetros do campo */
};

/**
 * Desenha o grafismo de partículas num <canvas>.
 * @param {HTMLCanvasElement} canvas
 * @param {object} config  ver DEFAULTS
 */
function render(canvas, config = {}) {
  const cfg = { ...DEFAULTS, ...config };
  const ctx = canvas.getContext('2d');
  /* Com width/height explícitos o canvas é desenhado no tamanho pedido em vez
     do tamanho de layout — é o caminho de exportação em alta resolução. Nesse
     caso não há dpr a aplicar: os pixels pedidos já são os pixels finais. */
  const forced = cfg.width != null && cfg.height != null;
  const dpr = forced ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  const w = forced ? cfg.width : (canvas.clientWidth || 640);
  const h = forced ? cfg.height : (canvas.clientHeight || 240);
  if (!w || !h) return;

  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (cfg.background) {
    ctx.fillStyle = cfg.background;
    ctx.fillRect(0, 0, w, h);
  }
  ctx.fillStyle =
    cfg.color || getComputedStyle(canvas).getPropertyValue('color').trim() || '#fff';

  const field =
    typeof cfg.shape === 'function'
      ? cfg.shape
      : (fields[cfg.shape] || fields.disc)(cfg.opts || {});

  const ar = h / w;                       /* v vai de 0 a ar */
  const cell = Math.max(2, cfg.cell);
  const cols = Math.ceil(w / cell);
  const rows = Math.ceil(h / cell);
  const [from, to] = cfg.ramp;
  const p = clamp01(cfg.progress);
  const rampCfg = {
    from, to, angle: cfg.angle, curve: cfg.curve,
    mirror: cfg.mirror, radial: cfg.radial,
  };

  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const u = ((i + 0.5) * cell) / w;
      const v = ((j + 0.5) * cell) / w;   /* mesma escala de u: preserva proporção */
      const cov = field(u, v, ar);
      if (cov <= 0) continue;

      let d = cov * rampAt(u, v, ar, rampCfg);
      /* Revelação: uma frente de onda atravessa o eixo da rampa, resolvendo
         primeiro a ponta densa (sinal) e depois a dispersa (ruído). */
      if (p < 1) {
        const BAND = 0.55;
        const behind = 1 - rampPos(u, v, ar, rampCfg);
        d *= clamp01((p - behind * BAND) / (1 - BAND));
      }
      if (d <= 0) continue;

      /* Meio-tom: a célula sempre existe, o que varia é o tamanho do ponto.
         Trama de impressão, sem ruído — o oposto do grão estocástico. */
      if (cfg.texture === 'halftone') {
        const side = cell * Math.sqrt(clamp01(d)) * 1.05;
        if (side < 0.4) continue;
        const off = (cell - side) / 2;
        ctx.fillRect(i * cell + off, j * cell + off, side, side);
        continue;
      }

      /* Trama ordenada (Bayer) ou grão estocástico: os dois decidem
         presença/ausência, mas um é regular e o outro é aleatório. */
      const threshold = cfg.texture === 'screen'
        ? BAYER[j & 7][i & 7]
        : hash(i, j, cfg.seed);
      if (threshold >= d) continue;

      const size = cfg.scale
        ? Math.max(1, cell * (0.5 + 0.5 * clamp01(d)))
        : Math.max(1, cell * 0.8);
      /* A trama ordenada não recebe jitter: o que a define é o alinhamento. */
      const jit = cfg.texture === 'screen' ? 0 : cfg.jitter;
      const jx = (hash(i, j, cfg.seed + 11) - 0.5) * jit * cell;
      const jy = (hash(i, j, cfg.seed + 23) - 0.5) * jit * cell;
      ctx.fillRect(i * cell + jx, j * cell + jy, size, size);
    }
  }
}

/** Anima a resolução de ruído → forma uma única vez. */
function resolve(canvas, config = {}, duration = 1600) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return render(canvas, { ...config, progress: 1 });
  }
  const t0 = performance.now();
  const step = (now) => {
    const t = clamp01((now - t0) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    render(canvas, { ...config, progress: eased });
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* --- Bootstrap declarativo ----------------------------------------------- */
const num = (s, f) => (s == null || s === '' ? f : Number(s));

function configFromEl(el) {
  const d = el.dataset;
  return {
    shape: d.cmcDither || 'disc',
    cell: num(d.cell, DEFAULTS.cell),
    ramp: d.ramp ? d.ramp.split(',').map(Number) : DEFAULTS.ramp,
    angle: num(d.angle, DEFAULTS.angle),
    curve: num(d.curve, DEFAULTS.curve),
    seed: num(d.seed, DEFAULTS.seed),
    jitter: num(d.jitter, DEFAULTS.jitter),
    mirror: d.mirror === 'true',
    radial: d.radial === 'true',
    texture: d.texture || DEFAULTS.texture,
    opts: d.opts ? JSON.parse(d.opts) : null,
  };
}

/**
 * Ativa todos os `[data-cmc-dither]` do documento: desenha ao entrar na tela,
 * redesenha ao redimensionar.
 */
function init(root = document) {
  const nodes = [...root.querySelectorAll('canvas[data-cmc-dither]')];
  if (!nodes.length) return;

  /* O campo `text` mede a fonte para se ajustar. Antes de a Inter Tight
     carregar, a medição sai da fonte de fallback e o grafismo nasce torto —
     então redesenha o que já foi desenhado assim que as fontes ficam prontas. */
  document.fonts?.ready.then(() => {
    nodes.forEach((n) => n.dataset.cmcDone && render(n, configFromEl(n)));
  });

  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting || e.target.dataset.cmcDone) continue;
      e.target.dataset.cmcDone = '1';
      resolve(e.target, configFromEl(e.target),
        num(e.target.dataset.duration, 1600));
    }
  }, { rootMargin: '80px' });

  nodes.forEach((n) => io.observe(n));

  let raf;
  addEventListener('resize', () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() =>
      nodes.forEach((n) => n.dataset.cmcDone && render(n, configFromEl(n)))
    );
  });
}

/* ==========================================================================
   Camacho — Configuração de marca
   --------------------------------------------------------------------------
   O nome da marca mora AQUI, num lugar só. As páginas declaram encaixes
   (`data-brand="name"`) e este módulo os preenche. Trocar o nome do negócio
   passa a ser trocar uma linha, não caçar strings em três arquivos.

   Para experimentar sem editar nada: ?brand=Camacho na URL.
   ========================================================================== */

const BRAND = {
  name: 'Camacho',
  version: '1.0.0',
  domain: 'camacho.ai',
  person: 'Leonardo Camacho',
  role: 'Consultor',
  /* Placeholder explícito: o telefone real ainda não foi definido. Trocar
     antes de qualquer peça impressa — ver Pendências no README. */
  phone: '+55 11 90000-0000',
};

/** Deriva domínio e e-mail de um nome novo, mantendo o resto. */
function deriveBrand(name, base = BRAND) {
  const slug = name.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g, '');
  return { ...base, name, domain: `${slug}.ai` };
}

/**
 * O símbolo é uma LETRA, e é o único ponto do sistema que depende do nome.
 * Todo o resto — motor, paleta, tipografia, grade — é indiferente a ele.
 */
const markFitsName = (name) => name.trim().toUpperCase().startsWith('C');

/**
 * Preenche os encaixes de marca do documento.
 *   data-brand="name" | "domain" | "person" | "role" | "phone"
 *   data-brand="email"          → person em minúsculas @ domínio
 *   data-brand-canvas           → redesenha o wordmark ditherizado
 */
function applyBrand(root = document, brand = BRAND) {
  const email = `${brand.person.split(' ')[0].toLowerCase()}@${brand.domain}`;
  const values = { ...brand, email };

  root.querySelectorAll('[data-brand]').forEach((el) => {
    const value = values[el.dataset.brand];
    if (value != null) el.textContent = value;
  });

  /* Canvas que compõem o próprio nome em partículas */
  root.querySelectorAll('canvas[data-brand-canvas]').forEach((el) => {
    const opts = el.dataset.opts ? JSON.parse(el.dataset.opts) : {};
    el.dataset.opts = JSON.stringify({ ...opts, text: brand.name });
    delete el.dataset.cmcDone;
  });

  return values;
}

/** Lê ?brand= da URL, se houver. */
function brandFromUrl(fallback = BRAND) {
  const param = new URLSearchParams(location.search).get('brand');
  return param ? deriveBrand(param.trim(), fallback) : fallback;
}
const marca = applyBrand(document, brandFromUrl());

const LOCK = (inv) => `
  <span class="cmc-lockup dk__lockup">

  </span>`;

const arte = (shape, ramp, seed, extra = '') =>
  `<div class="dk__art"><canvas data-cmc-dither="${shape}" data-ramp="${ramp}"
     data-cell="4" data-seed="${seed}" ${extra} aria-hidden="true"></canvas></div>`;

/* Nove slides: abertura, problema, tese, costura, método, incorporar,

  { campo: 'escuro', topo: `<p class="cmc-micro">Como eu trabalho</p>`,
    meio: arte('weave', '0.05,1', 19),
    pe: `<h2 class="dk__hed">Não vendo duas coisas.</h2>
         <p class="dk__corpo">O lado técnico e o lado humano, costurados na estratégia do negócio. Separá-los é o que faz a transformação falhar.</p>` },

  { campo: 'papel', topo: `<p class="cmc-micro">O método</p>`,
    meio: `<div class="dk__grade" style="--cols:3">
        <div class="dk__item"><h4>01 Diagnosticar</h4><p>Entender antes de propor</p></div>
        <div class="dk__item"><h4>02 Priorizar</h4><p>Urgência não é importância</p></div>
        <div class="dk__item"><h4>03 Estruturar</h4><p>Arquitetura antes de automação</p></div>
        <div class="dk__item"><h4>04 Implementar</h4><p>Até funcionar na operação</p></div>
        <div class="dk__item"><h4>05 Incorporar</h4><p>Líderes e times junto</p></div>
        <div class="dk__item"><h4>06 Medir</h4><p>No painel do cliente</p></div>
      </div>`,
    pe: `<p class="dk__corpo">Seis etapas. A quinta é a que quase todo projeto pula.</p>` },

  { campo: 'escuro', topo: `<p class="cmc-micro">05 · Incorporar</p>`,
    meio: arte('cohort', '0.14,1', 31),
    pe: `<h2 class="dk__hed">Mudar processo sem mudar como as pessoas decidem não instala capacidade.</h2>` },

  { campo: 'papel', topo: `<p class="cmc-micro">06 · Medir</p>`,
    meio: arte('gauge', '0.16,1', 23),
    pe: `<h2 class="dk__hed">A lacuna dá para medir.</h2>
         <p class="dk__corpo">Cada frente entra com a métrica declarada antes da primeira linha de código.</p>` },

        <div class="dk__item"><h4>Estruturação · 6 semanas</h4><p>Dados, processos e indicadores</p></div>
        <div class="dk__item"><h4>Implementação · contínuo</h4><p>Analytics, automação e agentes</p></div>
        <div class="dk__item"><h4>Incorporação · paralelo</h4><p>Líderes e times, do início</p></div>
      </div>`,
    pe: `<p class="dk__corpo">Contratável por etapa. O diagnóstico é a porta de entrada e já entrega decisão.</p>` },

  { campo: 'escuro', topo: LOCK(), meio: arte('handoff', '0.12,1', 41),
    pe: `<h2 class="dk__hed">O objetivo não é dependência.</h2>
         <p class="dk__corpo">Você precisa entender, usar e sustentar o que foi construído.</p>`,
    rodape: 'contato' },
];

const CAMPOS = { escuro: ['#000000', '#FFFFFF'], papel: ['#F2F0EE', '#000000'] };
const palco = document.getElementById('palco');
palco.innerHTML = SLIDES.map((s, i) => {
  const [bg, ink] = CAMPOS[s.campo];
  const rodape = s.rodape === 'contato'
    ? `<span>${marca.email}</span><span>${marca.domain}</span>`
    : `<span>${s.rodape || marca.domain}</span><span>${String(i + 1).padStart(2, '0')} / ${String(SLIDES.length).padStart(2, '0')}</span>`;
  return `<section class="dk__slide" data-i="${i}" style="--slide-bg:${bg};--slide-ink:${ink}">
    <div>${s.topo || ''}</div>
    ${s.meio.startsWith('<div class="dk__art"') ? s.meio : `<div style="display:flex;align-items:center">${s.meio}</div>`}
    <div>${s.pe || ''}<div class="dk__pe" style="margin-top:2cqi">${rodape}</div></div>
  </section>`;
}).join('');

let atual = 0;
const conta = document.getElementById('conta');
function mostrar(i) {
  atual = Math.max(0, Math.min(SLIDES.length - 1, i));
  palco.querySelectorAll('.dk__slide').forEach((s, k) => {
    s.toggleAttribute('data-ativo', k === atual);
  });
  conta.textContent = `${String(atual + 1).padStart(2, '0')} / ${String(SLIDES.length).padStart(2, '0')}`;
  /* Redesenha o grafismo do slide que entrou: o motor só desenha o que já
     esteve visível, e um slide escondido tem tamanho zero. */
  const cv = palco.querySelector(`.dk__slide[data-i="${atual}"] canvas`);
  if (cv) { delete cv.dataset.cmcDone; init(palco); }
}
mostrar(0);

document.getElementById('proximo').addEventListener('click', () => mostrar(atual + 1));
document.getElementById('anterior').addEventListener('click', () => mostrar(atual - 1));
document.getElementById('tela').addEventListener('click', () => {
  (document.fullscreenElement ? document.exitFullscreen() : palco.requestFullscreen()).catch(() => {});
});
addEventListener('keydown', (e) => {
  if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); mostrar(atual + 1); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); mostrar(atual - 1); }
  if (e.key === 'Home') mostrar(0);
  if (e.key === 'End') mostrar(SLIDES.length - 1);
  if (e.key.toLowerCase() === 'f') document.getElementById('tela').click();
});
addEventListener('resize', () => mostrar(atual));
palco.focus();
</script>
