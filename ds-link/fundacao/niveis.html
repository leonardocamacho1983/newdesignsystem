<!-- @dsCard group="Fundação" name="Níveis de maturidade" subtitle="Cinco níveis, e cada barra é literalmente a densidade do nível desenhada pelo mesmo motor de todo o resto. Nível é densidade, nunca matiz." width="1200" height="445" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Níveis de maturidade · Camacho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base.css">
</head>
<body>
<main class="ds">
  <header class="ds__cab">
    <h1 class="cmc-h2" style="margin:0">Níveis de maturidade</h1>
    <p class="ds__nota">Cinco níveis, e cada barra é literalmente a densidade do nível desenhada pelo mesmo motor de todo o resto. Nível é densidade, nunca matiz.</p>
  </header>
  <div class="ds__item" style="gap:14px">
    <div style="display:grid;grid-template-columns:minmax(9rem,1fr) minmax(0,3fr) auto;gap:16px;align-items:center">
      <span class="cmc-small">--cmc-level-1</span>
      <div class="ds__quadro" style="--ar:auto;height:2.25rem;border-radius:3px"><canvas data-cmc-dither="fill" data-ramp="0.1,0.1" data-cell="3" data-seed="18"  aria-hidden="true"></canvas></div>
      <span class="ds__rot">0.10</span>
    </div>
    <div style="display:grid;grid-template-columns:minmax(9rem,1fr) minmax(0,3fr) auto;gap:16px;align-items:center">
      <span class="cmc-small">--cmc-level-2</span>
      <div class="ds__quadro" style="--ar:auto;height:2.25rem;border-radius:3px"><canvas data-cmc-dither="fill" data-ramp="0.3,0.3" data-cell="3" data-seed="25"  aria-hidden="true"></canvas></div>
      <span class="ds__rot">0.30</span>
    </div>
    <div style="display:grid;grid-template-columns:minmax(9rem,1fr) minmax(0,3fr) auto;gap:16px;align-items:center">
      <span class="cmc-small">--cmc-level-3</span>
      <div class="ds__quadro" style="--ar:auto;height:2.25rem;border-radius:3px"><canvas data-cmc-dither="fill" data-ramp="0.52,0.52" data-cell="3" data-seed="32"  aria-hidden="true"></canvas></div>
      <span class="ds__rot">0.52</span>
    </div>
    <div style="display:grid;grid-template-columns:minmax(9rem,1fr) minmax(0,3fr) auto;gap:16px;align-items:center">
      <span class="cmc-small">--cmc-level-4</span>
      <div class="ds__quadro" style="--ar:auto;height:2.25rem;border-radius:3px"><canvas data-cmc-dither="fill" data-ramp="0.76,0.76" data-cell="3" data-seed="39"  aria-hidden="true"></canvas></div>
      <span class="ds__rot">0.76</span>
    </div>
    <div style="display:grid;grid-template-columns:minmax(9rem,1fr) minmax(0,3fr) auto;gap:16px;align-items:center">
      <span class="cmc-small">--cmc-level-5</span>
      <div class="ds__quadro" style="--ar:auto;height:2.25rem;border-radius:3px"><canvas data-cmc-dither="fill" data-ramp="1,1" data-cell="3" data-seed="46"  aria-hidden="true"></canvas></div>
      <span class="ds__rot">1.00</span>
    </div>
  </div>
</main>
<script type="module" src="../_motor.js"></script>
</body>
</html>
