<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rampas de densidade · Camacho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base.css">
</head>
<body>
<main class="ds">
  <header class="ds__cab">
    <h1 class="cmc-h2" style="margin:0">Rampas de densidade</h1>
    <p class="ds__nota">A rampa é a tese: complexidade → clareza. O que se ganha na ponta densa não é dado limpo, é capacidade. `angle` gira o eixo, `mirror` adensa no centro, `radial` adensa no miolo, `curve` decide quanto tempo a dispersão sobrevive.</p>
  </header>
  <div class="ds__grade">

  <figure class="ds__item">
    <div class="ds__quadro" style="--ar:16/9"><canvas data-cmc-dither="fill" data-ramp="0.03,0.85" data-cell="4" data-seed="7"  aria-hidden="true"></canvas></div>
    <figcaption class="ds__rot">linear · 0° (ruído à esquerda)</figcaption>
  </figure>

  <figure class="ds__item">
    <div class="ds__quadro" style="--ar:16/9"><canvas data-cmc-dither="fill" data-ramp="0.03,0.85" data-cell="4" data-seed="16" data-angle="180"  aria-hidden="true"></canvas></div>
    <figcaption class="ds__rot">linear · 180°</figcaption>
  </figure>

  <figure class="ds__item">
    <div class="ds__quadro" style="--ar:16/9"><canvas data-cmc-dither="fill" data-ramp="0.03,0.85" data-cell="4" data-seed="25" data-angle="90"  aria-hidden="true"></canvas></div>
    <figcaption class="ds__rot">linear · 90° (de baixo)</figcaption>
  </figure>

  <figure class="ds__item">
    <div class="ds__quadro" style="--ar:16/9"><canvas data-cmc-dither="fill" data-ramp="0.03,0.85" data-cell="4" data-seed="34" data-mirror="true"  aria-hidden="true"></canvas></div>
    <figcaption class="ds__rot">mirror · denso no centro</figcaption>
  </figure>

  <figure class="ds__item">
    <div class="ds__quadro" style="--ar:16/9"><canvas data-cmc-dither="fill" data-ramp="0.03,0.85" data-cell="4" data-seed="43" data-radial="true"  aria-hidden="true"></canvas></div>
    <figcaption class="ds__rot">radial · denso no miolo</figcaption>
  </figure>
  </div>
</main>
<script type="module" src="../_motor.js"></script>
</body>
</html>
