<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key visuals · Camacho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base.css">
</head>
<body>
<main class="ds">
  <header class="ds__cab">
    <h1 class="cmc-h2" style="margin:0">Key visuals</h1>
    <p class="ds__nota">Quatro KVs, uma ideia cada — porque um key visual que diz duas coisas não diz nenhuma. Sem fotografia: um KV se refaz de forma, rampa e semente em qualquer resolução, sem arquivo de origem.</p>
  </header>
  <div class="ds__grade">
    <figure class="ds__item">
      <div class="ds__quadro" style="--bg:#000000;--ink:#FFFFFF"><canvas data-cmc-dither="weave" data-ramp="0.04,1" data-cell="4" data-seed="7"  aria-hidden="true"></canvas></div>
      <figcaption class="ds__rot">KV 01 · A costura</figcaption>
      <p class="ds__nota">A tese: o lado técnico e o humano costurados na estratégia do negócio.</p></figure>
    <figure class="ds__item">
      <div class="ds__quadro" style="--bg:#000000;--ink:#FFFFFF"><canvas data-cmc-dither="text" data-ramp="0.06,1" data-cell="4" data-seed="11" data-opts='{"text":"Clareza\né vantagem","fit":0.96}'  aria-hidden="true"></canvas></div>
      <figcaption class="ds__rot">KV 02 · Complexidade vira clareza</figcaption>
      <p class="ds__nota">A cadeia da marca, com a própria assinatura como grafismo.</p></figure>
    <figure class="ds__item">
      <div class="ds__quadro" style="--bg:#F2F0EE;--ink:#000000"><canvas data-cmc-dither="gauge" data-ramp="0.12,1" data-cell="4" data-seed="23"  aria-hidden="true"></canvas></div>
      <figcaption class="ds__rot">KV 03 · A lacuna que se mede</figcaption>
      <p class="ds__nota">A marca como instrumento: a abertura do símbolo é a lacuna de capacidade.</p></figure>
    <figure class="ds__item">
      <div class="ds__quadro" style="--bg:#000000;--ink:#FFFFFF"><canvas data-cmc-dither="handoff" data-ramp="0.12,1" data-cell="4" data-seed="31"  aria-hidden="true"></canvas></div>
      <figcaption class="ds__rot">KV 04 · O que fica</figcaption>
      <p class="ds__nota">Transferência de capacidade: um lado esvazia, o outro enche.</p></figure>
  </div>
</main>
<script type="module" src="../_motor.js"></script>
</body>
</html>
